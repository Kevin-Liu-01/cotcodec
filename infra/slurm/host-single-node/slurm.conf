# CoTCodec single-user H100 bootstrap for fal-h100-01.
# Slurm 21.08.5 on this host has no cgroup-v2 plugin. This configuration is
# therefore restricted to infrastructure doctors and single-user discovery.
ClusterName=cotcodec-h100
SlurmctldHost=fal-h100-01

SlurmUser=slurm
SlurmdUser=root
AuthType=auth/munge
CredType=cred/munge

StateSaveLocation=/var/spool/slurmctld
SlurmdSpoolDir=/var/spool/slurmd
SlurmctldLogFile=/var/log/slurm/slurmctld.log
SlurmdLogFile=/var/log/slurm/slurmd.log
JobCompType=jobcomp/filetxt
JobCompLoc=/var/log/slurm/jobcomp.log

SlurmctldPort=6817
SlurmdPort=6818
SlurmctldTimeout=120
SlurmdTimeout=300
ReturnToService=2
MinJobAge=300
KillWait=30

SchedulerType=sched/backfill
SelectType=select/cons_tres
SelectTypeParameters=CR_Core_Memory
ProctrackType=proctrack/linuxproc
TaskPlugin=task/affinity
SwitchType=switch/none
MpiDefault=none

GresTypes=gpu
JobAcctGatherType=jobacct_gather/linux
JobAcctGatherFrequency=30
AccountingStorageType=accounting_storage/none

NodeName=fal-h100-01 CPUs=208 Boards=1 SocketsPerBoard=2 CoresPerSocket=52 ThreadsPerCore=2 RealMemory=1750000 Gres=gpu:h100:8 State=UNKNOWN
PartitionName=research Nodes=fal-h100-01 Default=YES DefaultTime=00:30:00 MaxTime=1-00:00:00 MaxMemPerNode=1750000 OverSubscribe=NO State=UP
