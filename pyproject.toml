[project]
name = "cotcodec"
version = "0.1.0"
description = "Language Choice as an Orchestration Variable for Tool-Using LLM Agents"
requires-python = ">=3.11"
authors = [{ name = "Kevin Liu", email = "k.bowen.liu@gmail.com" }]

dependencies = [
    "anthropic",
    "openai",
    "httpx",
    "tiktoken",
    "pyyaml",
    "pandas",
    "matplotlib",
    "seaborn",
    "rich",
    "pydantic",
    "numpy",
    "scipy",
    "cryptography",
    "huggingface-hub",
]

[project.optional-dependencies]
architecture = [
    "accelerate",
    "flash-linear-attention==0.5.2",
    "peft",
    "pyarrow",
    "safetensors",
    "tilelang>=0.1.13",
    "torch==2.11.0",
    "transformers",
]
diffusion = [
    "accelerate",
    "diffusers",
    "safetensors",
    "torch==2.11.0",
    "transformers",
]
memory-mem0 = [
    "mem0ai==2.0.18",
]
memory-graphiti = [
    "graphiti-core[falkordblite]==0.29.3",
]
memory-langmem = [
    "langgraph-checkpoint-postgres==3.1.0",
    "langmem==0.0.30",
    "psycopg[binary]==3.3.4",
]
memory-embedding = [
    "torch==2.11.0",
    "transformers",
]
tinker = [
    "tinker==0.23.3",
]
dev = [
    # The corpus check renders through the Qwen3.5 chat template (tests/test_q2_suite.py).
    "jinja2",
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.ruff]
# program/evidence holds recorded artifacts (including analysis scripts) verbatim.
extend-exclude = [
  "legacy",
  ".claude/skills",
  ".agents",
  "program/evidence",
  # Upstream parsers vendored byte for byte (harness/q2/action_path/upstream/vendor.py).
  "harness/q2/action_path/upstream/osworld_bfd62bdc.py",
  "harness/q2/action_path/upstream/gym_anything_bf965cde0.py",
  "harness/q2/action_path/upstream/gym_anything_aae6f7607.py",
]
line-length = 100
target-version = "py311"

[tool.ruff.format]
# The patched H-OSW-fixed copy keeps upstream's layout so its marked changes stay diffable.
exclude = ["harness/q2/action_path/upstream/osworld_bfd62bdc_fixed.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Mutation patches quote whole lines of the frozen sources as anchors.
"harness/q2/action_path/mutants.py" = ["E501"]
# The marked, patched H-OSW-fixed copy keeps its upstream typing style and line lengths;
# every other rule applies to the project's changes in it.
"harness/q2/action_path/upstream/osworld_bfd62bdc_fixed.py" = ["E501", "UP006", "UP035", "UP045"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
