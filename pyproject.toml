[project]
name = "cotcodec"
version = "0.1.0"
description = "Language Choice as an Orchestration Variable for Tool-Using LLM Agents"
requires-python = ">=3.11"
authors = [{ name = "Kevin Liu", email = "k.bowen.liu@gmail.com" }]

dependencies = [
    "anthropic",
    "openai",
    "httpx",
    "tiktoken",
    "pyyaml",
    "pandas",
    "matplotlib",
    "seaborn",
    "rich",
    "pydantic",
    "numpy",
    "scipy",
    "cryptography",
    "huggingface-hub",
]

[project.optional-dependencies]
architecture = [
    "accelerate",
    "flash-linear-attention==0.5.2",
    "peft",
    "pyarrow",
    "safetensors",
    "tilelang>=0.1.13",
    "torch==2.11.0",
    "transformers",
]
diffusion = [
    "accelerate",
    "diffusers",
    "safetensors",
    "torch==2.11.0",
    "transformers",
]
memory-mem0 = [
    "mem0ai==2.0.18",
]
memory-graphiti = [
    "graphiti-core[falkordblite]==0.29.3",
]
memory-langmem = [
    "langgraph-checkpoint-postgres==3.1.0",
    "langmem==0.0.30",
    "psycopg[binary]==3.3.4",
]
memory-embedding = [
    "torch==2.11.0",
    "transformers",
]
tinker = [
    "tinker==0.23.3",
]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.ruff]
# program/evidence holds recorded artifacts (including analysis scripts) verbatim.
extend-exclude = [
  "legacy",
  ".claude/skills",
  ".agents",
  "program/evidence",
  # Upstream parsers vendored byte for byte (harness/q2/action_path/upstream/vendor.py)
  # and the marked, patched H-OSW-fixed copy keep their upstream style.
  "harness/q2/action_path/upstream/osworld_*.py",
  "harness/q2/action_path/upstream/gym_anything_*.py",
]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Mutation patches quote whole lines of the frozen sources as anchors.
"harness/q2/action_path/mutants.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
