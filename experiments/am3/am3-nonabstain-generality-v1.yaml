# The steps of every job, in order, on its one H100. A reader step in batch-invariant mode that
# does not complete is followed by its fallback in vLLM's default mode (only then). Qwen3.5-9B
# runs in default mode: vLLM 0.31.0 refuses batch-invariant mode for GDN attention (AM3).
steps:
  - {id: rd-qwen3-8b, kind: reader, reader: qwen3-8b, batch_invariant: true, enforce_eager: true}
  - {id: rd-olmo2, kind: reader, reader: olmo-2-1124-7b-instruct, batch_invariant: true, enforce_eager: true}
  - {id: rd-olmo2-default, kind: reader, reader: olmo-2-1124-7b-instruct, batch_invariant: false, enforce_eager: true, only_if_incomplete: rd-olmo2}
  - {id: rd-qwen35-9b-default, kind: reader, reader: qwen3.5-9b, batch_invariant: false, enforce_eager: true}
  - {id: judge32, kind: judge, judge: primary, batch_invariant: true, enforce_eager: true}
  - {id: judge8, kind: judge, judge: secondary, batch_invariant: true, enforce_eager: true}

# Per job: the Slurm limit and, per step, [min_start_s, max_s]: a step starts only with min_start_s
# left before the deadline (the limit minus 210 s), and its passes stop at max_s.
jobs:
  development:
    gpus: 1
    minutes: 25
    step_budgets:
      rd-qwen3-8b: [300, 240]
      rd-olmo2: [300, 240]
      rd-olmo2-default: [300, 240]
      rd-qwen35-9b-default: [420, 360]
      judge32: [240, 180]
      judge8: [150, 120]
  heldout:
    gpus: 1
    minutes: 90
    step_budgets:
      rd-qwen3-8b: [1300, 1200]
      rd-olmo2: [1300, 1200]
      rd-olmo2-default: [1300, 1200]
      rd-qwen35-9b-default: [1900, 1800]
      judge32: [700, 600]
      judge8: [400, 300]
  abstention:
    gpus: 1
    minutes: 30
    step_budgets:
      rd-qwen3-8b: [400, 300]
      rd-olmo2: [400, 300]
      rd-olmo2-default: [400, 300]
      rd-qwen35-9b-default: [400, 300]
      judge32: [300, 240]
      judge8: [200, 150]

# Physical GPU-hours: the image build (5 min on 1 H100) plus the heldout (90 min) and abstention
# (30 min) jobs' limits, 2.08 GPU-h; with the one rerun the registration allows per job after an
# infrastructure failure, 4.08 GPU-h. The development dry run: 25 min plus a 5 min build, 0.5.
budget:
  build_minutes: 5
  registered_cap_gpu_hours: 2.08
  registered_cap_with_reruns_gpu_hours: 4.08
  dry_run_cap_gpu_hours: 0.5

analysis:
  bootstrap: {resamples: 10000, seed: 42}
  alpha: 0.05
  # LongMemEval-S's own mix: 470 answerable and 30 abstention questions of 500.
  natural_mix: {answerable: 470, abstention: 30}
