# am3-nonabstain-generality-v1 (D118; CONFIRMATORY once frozen in the ledger): does the
# non-abstention keep rule hold for other readers on held-out questions, and what does it cost on
# questions that have no answer? Registration: program/preregistrations/am3-nonabstain-generality-v1.md
#
# The rule (AM1d's nonabstain@70, H-C of am1-keepset-search-v1): read a pool's 4-subsets in BM25
# order and keep the first whose reply does not abstain (AM1d's four patterns, digest 031bee27...);
# keep BM25 top 4 when every 4-subset abstains.
#
# Three populations, each one GPU job (scripts/memcredit_am3g.py run --population P) on one H100
# in the cotcodec-vllm cu129 overlay built from the freeze commit's source capsule:
# - heldout (H1): AM1's 347 confirmatory questions, both pool arms (AM1's held-out study
#   artifact, unchanged);
# - abstention (H2): LongMemEval-S's 30 abstention questions (ids ending in _abs), retrieved arm
#   only, pools built as AM1's retrieved arm (scripts/memcredit_am3g.py prepare-abstention);
# - development: the pre-freeze dry run on the pilot's 63 development questions (exploratory).
# Per pool every reader answers the 70 4-subsets and the full pool (71 requests) with AM1's
# prompt, greedy, 64 tokens; then both judges score every distinct (question, reply) with
# LongMemEval's official prompt (the abstention template for _abs questions).
schema_version: 1
experiment_id: am3-nonabstain-generality-v1
claim_level: confirmatory
# 42: every engine seed and the bootstrap seed. 44: the abstention decoy draw. 43 is unused; the
# lane's seed-matrix contract binds three seeds to --seeds.
seeds: [42, 43, 44]

