image_id: FILL-image-b-image-id
git_sha: FILL-image-b-git-sha
source_sha256: FILL-image-b-source-tar-sha256
container_profile: default
resources:
  gpu_type: h100
  gpus: 1
  cpus: 16
  memory_gb: 64
  minutes: 9
budget:
  max_gpu_hours: 0.15
randomness_contract: assignment-seed-matrix
