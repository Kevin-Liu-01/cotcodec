# Q3 K1 resume test R1: trains to step 25, holds until the Slurm USR1 (180 s before the limit), saves on that signal and exits 75.
# Exit 75 is this leg's expected end: its orx node prints ORX_RESULT exit=5 (Slurm state FAILED 75:0);
# the pass criterion is termination.env reason=signal_USR1_checkpoint_confirmed, exit_code=75.
# Template: every FILL-* value is written by
# scripts/fill_sparse_indexer_k1_manifests.py from measured artifacts (image B
# build receipt, bundle sidecar, frozen preregistration, Slurm job ids). The
# submitter rejects every FILL-* value, so an unfilled template fails closed.
# Fields container_profile, seed_binding and memory_gb follow the stage0/lane
# submitter (container_profile default: 8 GB /tmp, 64 MB /dev/shm; seed_binding
# binds the --seeds argv to the declared seeds).
