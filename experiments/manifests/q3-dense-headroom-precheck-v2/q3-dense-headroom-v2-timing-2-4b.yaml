# q3-dense-headroom-precheck-v2: the second development timing job (program decision D42 (ii)).
# The first (D36, Slurm 766, template q3-dense-headroom-v2-timing-4b.yaml) ran the 4B path before
# the fix (cuDNN's attention on). This one times the fixed path at the code head: same model,
# inputs, container profile, CPUs, memory, limit (1 GPU x 6 minutes) and 0.1 GPU-h cap, same
# entry point and --profile timing, in its own run root so that it is filled, claimed and charged
# separately. The profile first runs the lane's start-up as the lane does, including its one
# attention_backend_check (cuDNN's attention on, then off), then the registered subset with
# per-unit component timings, the v1-path reference, then the lane's other chunks until Slurm's
# SIGUSR1 (3 minutes before the limit), answered as a lane answers it (exit 75, marker).
# It reads no preregistration and writes timing-receipt.json, never a lane receipt.
# Template: the three FILL-* image values are written by
# scripts/fill_dense_headroom_precheck_v2_manifests.py --timing 2 from the image build receipt.
