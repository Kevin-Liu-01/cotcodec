# Q1 Stage 0 pilot cost card (preregistration q1-stage0-gate-validation, step
# "pilot"): 8 substrates with all their mutants and the ruling-free positive
# controls, every gate and audit channel, seeds 42/43/44, one GPU. Measures
# per-gate GPU-seconds (median, p95) and the c/b cost ratio; projects the
# Stage 0 total against the 8 GPU-h cap. Pilot budget: at most 1 GPU-h.
#
# NOT SUBMITTED. Preconditions: the preregistration is frozen by the program
# owner; this branch includes main's lane merge (1f18cae) and runs from a
# source-overlay image of the frozen revision; the substrate and mutant corpus
# (stage0/q1-substrates, stage0/q1-mutate) is integrated and staged read-only
# under the run root; audit v1 is frozen after S1-cal calibration. FILL-* values
# come from measured artifacts at submission; the submitter rejects them unfilled.
runtime: docker-single-node-discovery-v1
name: q1-stage0-pilot
image_id: FILL-q1-gates-image-id
git_sha: FILL-git-sha
source_sha256: FILL-source-tar-sha256
container_profile: large-cpu-mem
resources:
  gpu_type: h100
  gpus: 1
  cpus: 32
  memory_gb: 256
  minutes: 60
budget:
  max_gpu_hours: 1.0
randomness_contract: assignment-seed-matrix
seeds: [42, 43, 44]
seed_binding:
  flag: "--seeds"
run_root: /home/kevin/cotcodec-runs/stage0/q1-core/pilot
model:
  kind: none
  reason: "Q1 Stage 0 scores compiler and pre-2025 human kernels and their mutants; no checkpoint"
command:
  - env
  - TRITON_CACHE_DIR=/outputs/cache/triton
  - TORCHINDUCTOR_CACHE_DIR=/outputs/cache/inductor
  - python
  - scripts/run_q1_stage0.py
  - "--corpus"
  - FILL-pilot-corpus-container-path
  - "--output"
  - /outputs/pilot
  - "--slots"
  - cuda:0
  - "--seeds"
  - "42"
  - "43"
  - "44"
