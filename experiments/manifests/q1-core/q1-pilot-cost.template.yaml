# Q1 Stage 0 pilot, job 2 of 2 (scripts/run_q1_gpu_pilot.py --job pilot): fidelity
# against unmodified KernelBench (both revisions), KernelGYM (b_native) and
# KernelBench-Verified (c1_kbv_native); audit calibration (A1, M = 16) on the S1-cal
# picks; time-boxed scoring of the registered pilot substrates, their mutants and
# controls through every gate and audit channel (harness.q1.pilot.schedule); timing.
# The cost card (scripts/q1_pilot_cost_card.py) is computed afterwards on the CPU.
#
# Inputs arrive as ONE hash-bound study artifact (harness/q1/study_artifact.py): the
# pilot corpus derived from job 1 by scripts/q1_prepare_pilot_corpus.py in a GPU-less
# container, and the unmodified KernelGYM@3a84417f and kernel_bench_verified@3fdf6fec
# trees read from git objects. It stays on the host; it is never committed or pushed.
#
# Trusted code only (D3, D7). Template: FILL-* values come from the image build
# receipt and the artifact pack receipt; the submitter rejects them unfilled.
runtime: docker-single-node-discovery-v1
name: q1-pilot-cost
image_id: FILL-q1-gates-image-id
git_sha: FILL-git-sha
source_sha256: FILL-source-tar-sha256
container_profile: large-cpu-mem
resources:
  gpu_type: h100
  gpus: 1
  cpus: 32
  memory_gb: 256
  minutes: 40
budget:
  max_gpu_hours: 0.67
randomness_contract: assignment-seed-matrix
seeds: [42, 43, 44]
seed_binding:
  flag: "--seeds"
run_root: /home/kevin/cotcodec-runs/stage0/q1-gates/pilot/runs
model:
  kind: none
  reason: "Q1 pilot fidelity, calibration and cost card on compiler and pre-2025 human kernels; no checkpoint"
study_artifact:
  source_id: q1-pilot-inputs
  revision: FILL-git-sha
  license: LicenseRef-q1-mixed
  host_path: FILL-study-artifact-host-path
  sha256: FILL-study-artifact-sha256
  size_bytes: FILL-study-artifact-size
command:
  - env
  - TRITON_CACHE_DIR=/outputs/cache/triton
  - TORCHINDUCTOR_CACHE_DIR=/outputs/cache/inductor
  - python
  - scripts/run_q1_gpu_pilot.py
  - "--job"
  - pilot
  - "--output"
  - /outputs/q1
  - "--evidence"
  - /inputs/study-artifact.json
  - "--expected-evidence-sha256"
  - FILL-study-artifact-sha256
  - "--budget-minutes"
  - "36"
  - "--slots-per-gpu"
  - "4"
  - "--seeds"
  - "42"
  - "43"
  - "44"
