# Q1 Stage 0 audit-hole replay (preregistration q1-stage0-gate-validation,
# section 6.7): every gate (a) trial and admissible gate (c) configuration that
# rejected a kernel the primary audit tier accepts is rebuilt and judged by the
# audit's rule against the fp64 oracle with audit v1's multiplier. One
# `audit_hole` item per kernel and replicate; seeds 42/43/44; one GPU.
# Budget: at most 0.5 GPU-h (requests are a small fraction of scored items).
#
# NOT SUBMITTED. Preconditions: the preregistration is frozen; the scoring run
# (or pilot) journal and corpus are staged read-only under the run root; audit
# v1 is frozen and FILL-audit-v1-multiplier is its `multiplier` from
# `scripts/q1_calibrate_audit.py`. Plan first with `--plan-only` in a GPU-less
# container. FILL-* values come from measured artifacts at submission; the
# submitter rejects them unfilled.
runtime: docker-single-node-discovery-v1
name: q1-audit-hole-replay
image_id: FILL-q1-gates-image-id
git_sha: FILL-git-sha
source_sha256: FILL-source-tar-sha256
container_profile: large-cpu-mem
resources:
  gpu_type: h100
  gpus: 1
  cpus: 32
  memory_gb: 256
  minutes: 30
budget:
  max_gpu_hours: 0.5
randomness_contract: assignment-seed-matrix
seeds: [42, 43, 44]
seed_binding:
  flag: "--seeds"
run_root: /home/kevin/cotcodec-runs/stage0/q1-core/audit-holes
model:
  kind: none
  reason: "Q1 Stage 0 replays gate rejections of compiler and pre-2025 human kernels; no checkpoint"
command:
  - env
  - TRITON_CACHE_DIR=/outputs/cache/triton
  - TORCHINDUCTOR_CACHE_DIR=/outputs/cache/inductor
  - python
  - scripts/q1_audit_hole_replay.py
  - "--journal"
  - FILL-scoring-journal-container-path
  - "--corpus"
  - FILL-corpus-container-path
  - "--output"
  - /outputs/audit-holes
  - "--multiplier"
  - FILL-audit-v1-multiplier
  - "--slots"
  - cuda:0
  - "--seeds"
  - "42"
  - "43"
  - "44"
