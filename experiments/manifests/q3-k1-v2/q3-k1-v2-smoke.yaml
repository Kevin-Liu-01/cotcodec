# Q3 K1 v2 smoke: v1's capture consistency and eager check; a 12-step training of all 28 layers (18 indexers each) and a 6-step
# timing run of the extension's 6 indexers; a 4-sequence stream-dev KL timing; 72 development units (24 per kind);
# steady-state rates and the main-job and worst-case-extension projections, each gated against its registered limit.
# Template: every FILL-* value is written by
# scripts/fill_sparse_indexer_k1_v2_manifests.py from measured artifacts (the v2 image B
# build receipt, the bundle sidecar, the frozen v2 preregistration, the contract's probe-derived
# job limits, Slurm job ids). The submitter rejects every FILL-* value, so an unfilled template
# fails closed. Fields container_profile, seed_binding and memory_gb follow the discovery-lane
# submitter (container_profile default: 8 GB /tmp, 64 MB /dev/shm; seed_binding binds the --seeds
# argv to the declared seeds).
