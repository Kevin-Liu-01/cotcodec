  model_id: qwen3-0.6b-base
  revision: da87bfb608c14b7cf20ba1ce41287e8de496c0cd
command:
  - python
  - scripts/run_sparse_indexer_phase0a.py
  - experiments/architectures/translation-supervised-sparse-indexer.yaml
  - --phase
  - 0a
  - --output-dir
  - /outputs/phase-0a
# ------------------------------------------------------------------------------

stages:
  - stage: cpu-doctors
    gpu_hours: 0
    promotion_gate: >-
      DONE in NumPy on 2026-09-01 (reference_doctor above, PASS): bilingual
      concatenation builder with mass accounting and permutation sensitivity;
      union-top-k fixed reference against brute force on 20 prompts; synthetic
      two-script toy reproducing an excess cross-script gap and its repair by
      L_x on a held-out language; decision-rule noise model; passage split.
      STILL OPEN: tokenizer-based TR-NIAH builder with the per-prompt
      achieved-token ledger and exact 50-gram plus MinHash dedup on real
      corpora; a 20-prompt indexer-versus-target recall smoke run on real
      hidden states inside the re-pinned container under a Slurm dry-run that
      the wrapper accepts; the fla parallel_nsa head-padding or gather path
  - stage: phase-0a-kill-screen
    gpu_hours_ceiling: 4
    promotion_gate: >-
      indexer-adequacy gate passes (English literal recall within 5 points of
      the target) on at least one base; learning rate selected on development
      languages from the three-point sweep and frozen; T* selected as the
      aggregation with the highest indexer cross-script (CX) recall on
      development languages subject to the 2-point MN band, and frozen; the
      Delta_T-per-aggregation and R^U sanity rows are written; on the Phase-0
      AUDIT partition of the sealed passages (never the primary partition):
      own-target excess xi_T at least 10 points for at least one aggregation,
      base and indexer form on held-out cross-script pairs; K2a (absolute
      cross-script shortfall against the fixed reference) evaluated and not
      fired; the noise model measured and recorded before Phase 1 is
      submitted: pooled within-configuration seed SD sigma-hat of block-form
      CX recall with its honest degrees of freedom (6 on the 0.6B base; 12
      only if homogeneity across bases is declared), its upper 80 percent
      chi-square bound sigma-up, the paired passage-cluster bootstrap SE
      se-prompt of a null two-arm block-form contrast (hs versus mp KL-only at
      matched seeds) at the primary prompt count, and kappa = max(0, min(3,
      6 - 2 se-D-up)) with se-D-up squared = 2 sigma-up squared / 5 plus
      se-prompt squared; if kappa = 0 Phase 1 is withheld and the seed
      variance is reported as the finding; dense monolingual and
      cross-lingual TR-NIAH headroom recorded; measured MFU re-verifies the
      Phase-1 budget
  - stage: phase-1-identification
    gpu_hours_ceiling: 10
    promotion_gate: >-
      pre-step (development languages only, block form, seed 42, 0.6B, about
      0.04 GPU-h under the shared teacher stream): (T*)+L_x trained at
      lambda_x 0.25 and 0.5, lambda_x frozen by the highest development CX
      recall within the 2-point MN band and the freeze recorded before the
      five-seed arms are submitted; then the primary endpoint D = R_c(CX) -
      R_b(CX) at least 6 recall points on the Phase-1 PRIMARY partition
      (read exactly once) of the held-out cross-script pairs with a 99 percent
      paired passage-cluster bootstrap interval excluding zero, over five
      seeds [42, 43, 44, 45, 46] of the block-form 0.6B arms, with MN recall
      within 1 point of (T*) and English E3 within 0.5 points; D at most
      kappa is K2b; kappa < D < 6 is the pre-registered inconclusive band
      (reported in full, no claim, no promotion); L_perm and L_half are inert
      and their gains are below half of D; L_sem's gain is below half of D;
      E2 gates G1 and G2 recorded before any E2 contrast is read; token-form
      and 4B replicate arms are descriptive
  - stage: phase-0b-production-indexer-probe
    gpu_hours_ceiling: 2
    promotion_gate: >-
      optional external-validity probe of the production QSA indexer in
      Qwen3.8-Flash-Next (unregistered; 120 prompts; 6 s per-prompt abort
      threshold); descriptive only; never promotes or kills
  - stage: phase-2-architecture-causal
    gpu_hours_ceiling: new contract required (about 30 GPU-h from-scratch hybrid; about 170 GPU-h QSA-style continued pretraining)
    promotion_gate: phase-1 passage and a separate matched-from-scratch contract with a parity BPE

starting_point:
  arms:
    - name: kl-only-indexer-qwen3-0-6b
      mode: frozen-checkpoint-retrofit
      model_ids: [qwen3-0.6b-base]
      is_control: true
      purpose: >-
        KL-only indexers on all 28 layers of the frozen 0.6B base for every
        target aggregation (head-sum, max-pool, retrieval-head-weighted) in
        token and block form at seeds 42-44, plus a three-point learning-rate
        sweep of the block-form head-sum indexer at seed 42 on development
        languages; T* (highest indexer CX recall on development languages
        within the MN band) is the primary counterfactual and the head-sum
        recipe the DSA-style secondary; Phase-1 block-form arms run five seeds.
    - name: alignment-supervised-indexer-qwen3-0-6b
      mode: frozen-checkpoint-retrofit
      model_ids: [qwen3-0.6b-base]
      is_control: false
      purpose: >-
        (T*)+L_x and head-sum+L_x indexers trained in the same frozen-teacher
        stream on identical bilingual concatenations; the primary treatment;
        block form at five seeds [42, 43, 44, 45, 46], token form at three
        seeds (descriptive).
    - name: same-loss-form-controls-qwen3-0-6b
      mode: frozen-checkpoint-retrofit
      model_ids: [qwen3-0.6b-base]
      is_control: true
      purpose: >-
        (T*)+L_perm (permuted labels), (T*)+L_half (other-language half) with
        pre-registered inertness preconditions, and (T*)+L_sem (monolingual
        TyDi QA question-to-passage supervision in training languages only,
        iso-token, no parallel data); block form at five seeds.
    - name: kl-only-indexer-qwen3-5-4b-base
      mode: frozen-checkpoint-retrofit
      model_ids: [qwen3.5-4b-base]
      is_control: true
      purpose: >-
        KL-only indexers on the full-attention layers of the frozen hybrid
        base, the production placement. qwen3.5-4b-base (Qwen/Qwen3.5-4B-Base
        @ 1001bb4d826a52d1f399e183466143f4da7b741b) was registered and fetched
        with a receipt on 2026-09-01 and replaces the post-trained qwen3.5-4b
        used through wave 4; the full-attention layer placement (3, 7, ...,
        31) is taken from the post-trained config and must be re-read from
        the Base config before enablement.
    - name: alignment-supervised-indexer-qwen3-5-4b-base
      mode: frozen-checkpoint-retrofit
      model_ids: [qwen3.5-4b-base]
      is_control: false
      purpose: >-
        Replicate of (T*)+L_x, (T*)+L_perm and (T*)+L_sem on the hybrid base
        at 2 seeds, descriptive, to test whether the retrofit result survives
        production placement on a GDN hybrid.
    - name: dense-lora-pair-qwen3-0-6b
      mode: checkpoint-finetune
      model_ids: [qwen3-0.6b-base]
      is_control: true
      purpose: >-
        Rank-16 LoRA on q,k of all layers: (j) LM-loss-only on bilingual
        concatenations and (k) LM loss plus lambda L_x on head-summed main
        attention, matched tokens; (k) minus (j) isolates the L_x-specific dense
        effect against which selection-specificity is judged.

intervention:
  mechanism: >-
    A detached top-k indexer I_t(s) = sum_j w_tj ReLU(q_tj . k_s) per sparse
    layer is distilled by KL from a fixed aggregation T of the frozen layer's
    full attention (head-sum, max-pool, or retrieval-head-weighted). The
    translation view concatenates a bilingual document pair with its
    corpus-given sentence alignment and adds L_x, the negative log of the
    indexer softmax mass on the aligned sentence's keys, to the KL loss; the
    backbone, main attention and inference path are untouched. Selection is
    evaluated on sealed prompts whose four query conditions (mono-literal
    ceiling, mono-non-literal reference, cross same-script, cross cross-script)
    share haystack, needle and position and differ only in query language.
    One fixed reference R^U, the needle recall of the union of every head's
    own top-k under the frozen layer's full attention (same k per head;
    superset budget; identical for every aggregation), anchors the
    target-aggregation comparison; T* is the aggregation whose indexer has the
    highest absolute cross-script recall on development languages within a
    2-point monolingual band, and the primary endpoint is the absolute paired
    recall difference of (T*)+L_x over (T*) on held-out cross-script pairs.
  trainable_components:
    - indexer query and key projections and per-head weights (4 heads x 128; block form 1 kv head, compress ratio 4)
    - rank-16 LoRA adapters on q,k in the two dense control arms only
  frozen_components:
    - backbone weights, tokenizer and generation config of both bases
    - target aggregation T* and the indexer learning rate after Phase-0 selection on development languages; lambda_x after the registered Phase-1 development-language pre-step
    - the fixed reference definition R^U (union of per-head top-k, same k per head) and the K2b threshold kappa once computed from the Phase-0 noise model (pooled seed SD with honest df, its upper 80 percent bound, and the paired passage-cluster bootstrap SE)
    - the passage-id partition (development / Phase-0 audit / Phase-1 primary) once hashed into the evidence bundle
    - corpus-given sentence alignments (ParaDocs, TED2020) and their release filters
    - evaluation prompts, haystacks, needle positions, passage-id split and achieved-token ledger

data:
  train:
    source: >-
      ParaDocs (HF jhu-clsp/paradocs; en-{de,fr,es,pl} same-script and
      en-{th,hi,km} cross-script; release filters minimum_size 2,
      frequency_cutoff 100, lid_cutoff 0.5) plus OPUS TED2020 v1 talk-level
      documents (en-zh_cn, en-ru, en-ar) as bilingual concatenations, and
      FineWeb-2 monolingual text in the training languages; TyDi QA GoldP
      (en/ar/ru/th only) for the L_sem arm
    identity: >-
      HF dataset revisions, OPUS corpus version, paradocs filter settings,
      document and pair hashes, and the 50M/100M-token sequence manifests must
      be frozen and hashed before enablement; held-out evaluation languages
      never appear in any training stream
  development:
    source: >-
      Held-out ParaDocs/TED2020 documents in the training language pairs, and
      Belebele passages from the 25 percent development passage-id split in the
      in-training cross-script languages (th, hi, km, zh, ar) for learning-rate
      selection and T* selection in Phase 0a, and for the registered lambda_x
      selection pre-step at the start of Phase 1
    identity: >-
      Passage ids and document ids disjoint from training and from the sealed
      test split; every language variant of a Belebele passage lives in exactly
      one split; learning rate and T* are frozen here in Phase 0a and lambda_x
      is frozen here in the Phase-1 pre-step, each before any held-out number
      is read
  test:
    source: >-
      Sealed Belebele passages (75 percent passage-id split) as needles and
      questions in held-out languages ja, ko, bn, ta, el, he, ka (cross-script)
      and id, tr, sw, nl, it (same-script), FineWeb-2 haystacks in the needle
      language, WMT24++ document-level sets for the second TR-NIAH task,
      English RULER-style E3 prompts, MLNeedle and OneRuler protocol baselines;
      held-out cross-script pairs are (needle X, query en) and (needle en,
      query X) for X in {ja, ko, bn, ta, el, he, ka}, 14 pairs
    identity: >-
      Passage ids, document ids, needle positions, achieved-token counts and
      prompt hashes stored in the evidence bundle before enablement; untouched
      by any training or development step. The sealed 75 percent is itself
      partitioned once by passage id (deterministic hash order, seed 42) into a
      Phase-0 AUDIT partition (25 percent of all passages) that K1, K2a, the
      adequacy gate, sigma-hat and se-prompt read, and a Phase-1 PRIMARY
      partition (50 percent of all passages) that no gate touches and that D
      reads exactly once; reads outside the declared partition fail closed
      (harness.translation_supervised_indexer.assert_reads_within)
    sealed: true
  contamination_checks:
    - exact 50-gram and MinHash (Jaccard at least 0.8) deduplication of every training and haystack document against every evaluation text, with removal counts in the run receipt
    - passage-id split keeps all 122 language variants of a Belebele passage in one split; held-out languages excluded from L_x, L_sem and LoRA training; TyDi QA bn/ja/ko/sw/id portions excluded
    - needle-absent E2 control bounds parametric recall of Belebele/FLORES passages; two-forward-pass prefix-invariance audit on sparse arms
    - literal-copy ceiling row and literalness gap reported separately so no cross-lingual number rests on a verbatim-match query

controls:
  - name: kl-only-best-label-free-target-t-star-by-absolute-cx-recall
    matches: [base, indexer-form, indexer-dim, training-tokens, data-order, achieved-budget, learning-rate]
  - name: kl-only-head-sum-dsa-recipe
    matches: [base, indexer-form, training-tokens, data-order, achieved-budget, learning-rate]
  - name: target-aggregation-ladder-for-k2a
    matches: [base, indexer-form, training-tokens, data-order, learning-rate]
  - name: fixed-reference-union-top-k-and-delta-t-sanity-rows
    matches: [prompts, k-per-head, base, layer]
  - name: indexer-learning-rate-sweep-on-development-languages
    matches: [base, indexer-form, training-tokens, data-order]
  - name: lambda-x-selection-pre-step-on-development-languages
    matches: [base, indexer-form, target-aggregation, training-tokens, data-order, seed]
  - name: permuted-label-same-loss-form-with-inertness
    matches: [loss-form, lambda, training-tokens, data-order, target-aggregation, seeds]
  - name: other-language-half-mass-with-inertness
    matches: [loss-form, lambda, training-tokens, data-order, target-aggregation, seeds]
  - name: monolingual-semantic-supervision-tydiqa
    matches: [loss-form, supervision-token-count, training-tokens, data-order, target-aggregation, seeds]
  - name: dense-lm-only-lora-and-dense-lm-plus-alignment-lora
    matches: [lora-rank, training-tokens, data, seeds]
  - name: spotattention-dual-top-p-mass-matched
    matches: [selected-mass, achieved-budget, base, prompts]
  - name: larger-k-at-matched-measured-latency
    matches: [kernel-latency, base, prompts]
  - name: pivot-style-query-group-rescoring
    matches: [achieved-budget, base, prompts]
  - name: nsa-pooled-key-selection-no-learned-indexer
    matches: [achieved-budget, block-size, base, prompts]
  - name: swa-plus-attention-sinks-matched-kv-bytes
    matches: [kv-bytes, base, prompts]
  - name: oracle-needle-block-random-fill-and-random-plus-needle
    matches: [achieved-budget, prompts]
  - name: needle-absent-parametric-recall
    matches: [prompts, k, base]
  - name: mlneedle-and-oneruler-dense-baselines
    matches: [needle-language, haystack-language, context-length, base]
  - name: indexer-dim-ladder-64-128-256
    matches: [parameters-otherwise, training-tokens, data-order, base]

primary_endpoint:
  metric: >-
    D = R_c(CX) - R_b(CX): the absolute paired E1 needle-token selection recall
    gain, in recall points, of the (T*)+L_x block-form indexer (c) over the
    (T*) KL-only block-form indexer (b) on held-out cross-script prompt pairs
    at achieved-budget fraction 12.5 percent and 8K context on
    qwen3-0.6b-base, five seeds, read exactly once on the Phase-1 primary
    passage partition; confirm if D at least 6 with the 99 percent interval
    excluding zero and MN within 1 point; K2b if D at most kappa, with kappa
    derived from the measured Phase-0 noise model (seed and prompt components
    combined, upper confidence bound on sigma); kappa < D < 6 is the
    pre-registered inconclusive band; the relative bar
    rho_x = D / xi^U_T* is secondary and descriptive, reported with the
    denominator's own passage-cluster interval propagated
  direction: maximize
  minimum_effect: 6.0
  unit_of_analysis: >-
    matched prompt (haystack, needle passage and position fixed; query language
    varied), clustered by Belebele passage id, with seed as a blocking factor
  aggregation: >-
    paired prompt-level difference, macro-averaged over the 14 held-out
    cross-script language pairs (both query directions), passage-cluster
    bootstrap with seeds treated as paired blocks (five seeds, block form)

statistics:
  seeds: [42, 43, 44, 45, 46]
  interval: >-
    paired passage-cluster bootstrap 99 percent interval for the primary
    contrast and 95 percent for secondaries; per-seed and per-language values
    reported; Phase 0a and the wrapper manifest above use seeds 42-44; Phase-1
    block-form arms on qwen3-0.6b-base use all five seeds unconditionally;
    token-form arms (three seeds), the 4B replicate (two seeds) and the LoRA
    pair (two seeds) are descriptive; the K2b threshold kappa is fixed before
    Phase 1 is submitted from the measured Phase-0a noise model: se-D-up
    squared = 2 sigma-up squared / 5 plus se-prompt squared, where sigma-up is
    the upper 80 percent chi-square bound of the pooled within-configuration
    seed SD at its honest df (6 on the 0.6B base) and se-prompt is the paired
    passage-cluster bootstrap SE of a null two-arm contrast at the primary
    prompt count; under the ASSUMED inputs sigma-hat 2 (df 6) and se-prompt
    1.3 this gives sigma-up about 2.8, se-D-up about 2.2, kappa about 1.6 and
    an MDE about 7.5 points (the wave-4 seed-only figures 1.26 and 4.3 are
    withdrawn); the Phase-1 primary partition is sized so that 6 - kappa is
    at least 2 se-D-up, or the confirm threshold is raised or seeds added
    before submission
  multiplicity: >-
    one primary contrast; Holm correction within the kill-condition family and
    within per-language secondaries; literal-copy ceiling, literalness gap,
    Delta_T sanity rows, rho_x, Belebele MC and Phase 0b are descriptive and
    uncorrected

falsifiers:
  - K1 kill if, with the adequacy gate passed, the own-target excess xi_T is at most 5 points for every target aggregation on both bases and both indexer forms (localization negative; xi_T is a uniform null across aggregations).
  - K2a (re-registered on absolute cross-script recall) kill the alignment line if, with the head-sum indexer's cross-script shortfall from the fixed reference S_hs = R^U(CX) - R_ind^hs(CX) at least 3 points, the best label-free indexer recovers at least 80 percent of it, R_ind^T*(CX) - R_ind^hs(CX) >= 0.8 S_hs, on held-out cross-script pairs at matched achieved budget; the Delta_T-per-aggregation row is reported alongside so a small xi from a cross-lingually weak target cannot pass as recovery.
  - K2b kill if the primary absolute gain D = R_c(CX) - R_b(CX), read once on the primary partition over five seeds, is at most kappa = max(0, min(3, 6 - 2 se-D-up)) points, where se-D-up squared = 2 sigma-up squared / 5 plus se-prompt squared, sigma-up is the upper 80 percent chi-square bound of the pooled Phase-0a within-configuration seed SD of block-form CX recall at its honest degrees of freedom (6 on the 0.6B base unless cross-base homogeneity is declared), and se-prompt is the paired passage-cluster bootstrap SE of a null two-arm block-form contrast on the audit partition at the primary prompt count; kappa < D < 6 is inconclusive, not a pass and not a kill; kappa = 0 withholds Phase 1.
  - K3 kill or re-frame if, with inertness holding, the (T*)+L_perm or (T*)+L_half absolute gain reaches at least 80 percent of D; if inertness fails the loss-form question is reported unresolved.
  - K4 kill if the (T*)+L_sem absolute gain reaches at least 50 percent of D on held-out cross-script pairs (generic semantic sharpening).
  - K5 kill if any training-free control at matched achieved budget recovers at least 80 percent of the E2 gain.
  - K6 kill if the L_x-specific dense LoRA gain (k) minus (j) reaches at least 80 percent of the sparse E2 gain (not selection-specific).
  - K7 kill if gains are confined to in-training languages; E1 gains without E2 gains are pre-registered as INCONCLUSIVE (not a kill) because the E2 line has a closed-form MDE of about 8.4 EM points at three seeds and 1,500 prompts under an assumed 2-point seed SD, above its registered 8-point effect, so an absent E2 gain cannot be distinguished from an underpowered read.
  - K8 kill if any held-out language's non-literal recall drops over 2 points versus (T*) or English E3 drops over 0.5 points.
  - K9 withdraw the E2 claim if dense cross-lingual TR-NIAH exact match is under 40 percent on both bases; report E2 contrasts as floor-bound on any base where sparse (T*) monolingual recall is under R^T minus 5.

