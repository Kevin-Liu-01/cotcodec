schema_version: 1
name: translation-supervised-sparse-indexer
direction: Translation-Supervised Sparse Indexer (Direction 21)
readiness: contract
claim_scope: attachment-capability
research_question: >-
  Do KL-distilled DSA/QSA-class sparse-attention indexers attached to frozen
  released checkpoints lose more cross-script needle-selection recall than the
  full attention they are distilled from once both legs of the gap are
  non-literal queries, and does corpus-given sentence-alignment supervision of
  the detached indexer raise absolute cross-script selection recall on held-out
  cross-script pairs, at matched achieved token budget, beyond what the best
  label-free target aggregation (selected on absolute cross-script recall, not
  on the excess statistic) already delivers?
null_hypothesis: >-
  Any cross-lingual selection gap of a KL-only indexer is either a
  literal-versus-semantic retrieval effect that is also present monolingually,
  or a recipe artifact that a label-free target aggregation removes when
  judged against one fixed reference (the union of per-head top-k of the full
  multi-head attention); alignment supervision adds no absolute cross-script
  recall beyond bilingual exposure, a permuted-label loss of the same form,
  monolingual semantic supervision, or dense LoRA fine-tuning.

# --- Phase-0 CPU doctor (wave 5; exists and passes) ---------------------------
# Executability and gate-semantics doctor only. Every number it writes is a
# synthetic-case number from a NumPy toy; it proves that the Phase-0 objects run
# on CPU and that the registered gates fire in the registered direction. It
# proves nothing about any language model, checkpoint, dataset or GPU budget
# and does not lift the Compute doctor from FAIL.
reference_doctor:
  implementation: harness/translation_supervised_indexer.py
  command_argv:
    - uv
    - run
    - python
    - scripts/run_translation_supervised_indexer_doctor.py
    - --output
    - data/results/translation-supervised-sparse-indexer/phase0-doctor.json
  runtime: numpy-cpu
  evidence_grade: >-
    EXECUTABILITY_AND_GATE_SEMANTICS_ONLY; synthetic-case numbers; no model,
    checkpoint, tokenizer or dataset is touched; the Compute doctor stays FAIL
  objects:
    - detached top-k indexer I_t(s) = sum_j w_tj ReLU(q_tj . k_s) with causal softmax and deterministic top-k
    - label-free targets hs, mp, rh (retrieval-head-weighted by measured copy score) and the KL distillation loss
    - fixed reference R^U (union of per-head top-k, same k per head) and budget-matched U_k, with a brute-force check
    - per-condition selection recall and the statistics Delta, xi_T, xi^U_T, S_T, Lambda, T* rule, lambda_x rule, D
    - alignment log-mass loss L_x with label-mass accounting, L_perm (derangement) and L_half controls
    - bilingual concatenation builder with corpus-given sentence alignment (keys first, queries second)
    - synthetic bilingual world (two scripts related by a fixed symmetric reflection, eight-head softmax teacher, rank-16 ReLU indexer trained by analytic gradients)
    - passage-id split development / audit / primary with fail-closed read separation
    - decision rule from a stated noise model (pooled seed SD with honest df, chi-square upper bound, combined seed plus prompt SE, kappa, withholding, paired passage-cluster bootstrap)
    - gates adequacy, bug tell, P1, K1, K2a, K2b, K3, K4, K8 and inertness as pure functions
  registered_cases:
    - synthetic excess cross-script gap and its repair by L_x on a held-out script-1 language never seen by the alignment loss (positive control; seeds 42, 43, 44; T* and lambda_x frozen on development prompts)
    - permuted-label and other-half same-loss-form controls with inertness
    - shifted-script negative control (a different reflection; the alignment gain must collapse while the shifted teacher stays at ceiling)
    - fixed-reference builder against brute force on 20 prompts, U_k budget check, random-selection chance level
    - analytic gradient of KL plus lambda_x L_x against central finite differences
    - L_x label-mass accounting and true-versus-permuted-label sensitivity
    - decision rule from a stated noise model with assumed (not measured) inputs, including the withheld regime
    - passage-id split and fail-closed audit / primary read separation
    - leakage and causality perturbations (future key, label leak, query-before-key order, non-causal probabilities)
    - degenerate-input rejection (28 inputs)
    - gate semantics on hand-made tables (T* band and tie-break, adequacy, bug tell, P1, K1, K2a, K2b, K3, K4, K8, inertness)
  gates:
    - adequacy gate passes and no bug tell at every seed
    - xi_T* at least 10 points on the held-out language at every seed while R^U shows no cross-script gap
    - D = R_c(CX) - R_b(CX) at least 6 points on the held-out language at every seed
    - L_perm and L_half gains under half of D; no held-out MN or CS drop over 2 points
    - alignment gain collapses under a different script map at every seed
    - union reference equals brute force on 20 of 20 prompts; U_k rows within k; random selection at chance
    - analytic gradient within 1e-6 relative error of finite differences
    - kappa in [0, 3], non-increasing in sigma, confirm-kill separation at least 2 se_D when Phase 1 runs, withheld at kappa 0, honest df 6 for three configurations at three seeds
    - every leakage, causality and degenerate input is rejected with IndexerContractError
  exclusions:
    - no language-model, checkpoint, tokenizer, dataset or fla-kernel claim
    - no claim about the size or sign of xi, D, sigma-hat or kappa in the real pilot
    - no Slurm, container, MFU or Compute-doctor attestation
    - the toy has one tokenizer (fertility 1), so the achieved-token ledger is a symbol count
  receipt: data/results/translation-supervised-sparse-indexer/phase0-doctor.json
  receipt_status: PHASE0_DOCTOR_PASS on 2026-09-01 (about 25 s CPU; tests/test_translation_supervised_indexer_doctor.py, 16 tests)

# --- Slurm wrapper manifest fields (wave 4, re-checked wave 5) ----------------
# scripts/submit_docker_research_job.py validates the whole YAML as a job
# manifest before it emits sbatch. The fields below are the truthful subset
# that can be declared today for the Phase-0a job. image_id, git_sha,
# source_sha256, model.cache_host_path, model.receipt_sha256 and
# model.artifact_root_sha256 are deliberately ABSENT. A rebuilt image with fla
# 0.5.2 now exists (cotcodec-research:999f5583-architecture, image ID
# sha256:9d832a59fe348d149d2e4587ac6af90223e2956ebb646d7b19295298954ca5ad), but
# it predates this contract's code, lacks tilelang and peft, and no smoke run
# has attested the code path inside it; the GPU entry point named in command
# does not exist yet. Filling image_id from that image would make the dry-run
# pass without a runnable job, so it stays absent and the dry-run still exits 1
# at image_id (re-run 2026-09-01 in wave 5; recorded verbatim in the proposal).
runtime: docker-single-node-discovery-v1
resources:
  gpu_type: h100
  gpus: 8
  cpus: 64
  memory_gb: 512
  minutes: 30
budget:
  max_gpu_hours: 4.0
randomness_contract: assignment-seed-matrix
seeds: [42, 43, 44]
run_root: /home/kevin/cotcodec-runs/translation-supervised-sparse-indexer/phase-0a
