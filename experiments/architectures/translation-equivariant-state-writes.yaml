schema_version: 1
name: translation-equivariant-state-writes
direction: Translation-Equivariant State Writes
readiness: contract
claim_scope: architecture-causal
research_question: >-
  Does supervising the pure recurrent-state write W(a|c) = S(c+a) - S_{v=0}(c,a)
  of half the Gated DeltaNet heads on public bitext, with same-prefix negatives,
  close at least half of a hybrid's cross-lingual recall gap on surface-disjoint
  beyond-window keys at equal monolingual recall and LM loss, and beat the same
  loss applied to the decay-free projection pooling of the same heads?
null_hypothesis: >-
  Any cross-lingual recall gain comes from projection alignment, language-marginal
  alignment of the write, bitext exposure, or a surface/copy shortcut rather than
  from aligning the recurrence-weighted write itself; or the frozen hybrid's gap
  is a readout-interference effect that no write-side loss can address.

stages:
  - stage: cpu-object-doctor
    gpu_hours: 0
    promotion_gate: >-
      fp64 identity S_{S0=0}(a) == S(c+a) - S_{v=0}(c,a) to 1e-10 on a 2-layer GDN;
      S(c) bitwise identical across a bitext pair; TP-MQAR-v2 leakage controls at
      chance; FLORES+ deduplicated against every phase-1 stream
  - stage: frozen-within-model-kill-screen
    parameters: 7B frozen (unregistered allenai/Olmo-Hybrid-7B and allenai/Olmo-3-1025-7B)
    gpu_hours_ceiling: 4
    promotion_gate: >-
      language-competence and dense cross-lingual EM floor gates pass for at least one
      language pair; D-zero exceeds its matched distractor perturbation by more than 10
      points; G(8) above 3 points and G(128)/G(8) below 2; rank-capped transport closes
      less than 80 percent of the gap; W translation-pair cosine exceeds its same-prefix floor
  - stage: small-model-identifiability
    parameters: 57M matched from-scratch hybrids and dense control
    gpu_hours_ceiling: 12
    promotion_gate: >-
      A1 minus A2 at least 5 EM points same-signed in all three seed pairs with a
      prompt-clustered CI excluding zero; A3 closes under half of A1; LM loss within
      1 percent; mean write norm shrinks under 30 percent
  - stage: confirmation
    parameters: 5 seeds and conditional dense-plus-loss arm
    gpu_hours_ceiling: new contract required after small-model passage
    promotion_gate: five-seed primary endpoint and all secondary gates pass

starting_point:
  arms:
    - name: frozen-hybrid-state-screen
      mode: frozen-checkpoint-retrofit
      model_ids: [qwen3.5-4b]
      is_control: false
      purpose: >-
        Registered stand-in for the unregistered allenai/Olmo-Hybrid-7B
        (revision 4f1cc566f9fdf3ce68da2ab6a788a83d89896dcf) named in the proposal
        and direction; phase-0 within-model state interventions (D-zero with matched
        perturbation, rank-capped transport, swap, N-scaling) run on the Olmo hybrid
        once it is registered; qwen3.5-4b is instrument-only.
    - name: frozen-dense-reference
      mode: frozen-checkpoint-retrofit
      model_ids: [qwen3-0.6b-base]
      is_control: true
      purpose: >-
        Registered stand-in for the unregistered allenai/Olmo-3-1025-7B
        (revision a81bae42db3975be1671e27b9c9a56da1a9f980f), the throughput-matched
        descriptive dense reference that supplies the cross-lingual EM floor gate;
        no causal use of the pair.
    - name: hybrid-baseline-a0
      mode: matched-from-scratch
      model_ids: [delta-net-1.3b-8k]
      is_control: true
      purpose: >-
        57M SWA-512 plus GDN hybrid trained on the bitext-containing mixture with
        lambda 0, using the registered fla delta-net code lineage without loading weights.
    - name: hybrid-write-equivariance-a1
      mode: matched-from-scratch
      model_ids: [delta-net-1.3b-8k]
      is_control: false
      purpose: >-
        Treatment: cosine plus InfoNCE on the pure write W of half the GDN heads with
        same-prefix translation positives and same-prefix content negatives.
    - name: hybrid-projection-alignment-a2
      mode: matched-from-scratch
      model_ids: [delta-net-1.3b-8k]
      is_control: true
      purpose: >-
        Decisive control: identical loss, lambda, tau, negatives, layers and heads on
        the decay-free erase-free pooling P(a) of the same heads' projections.
    - name: hybrid-language-marginal-placebo-a3
      mode: matched-from-scratch
      model_ids: [delta-net-1.3b-8k]
      is_control: true
      purpose: >-
        Placebo: same loss with a content-independent same-prefix language-B sentence;
        reads out language-ID removal on the write.
    - name: dense-full-attention-a4
      mode: matched-from-scratch
      model_ids: [smollm2-135m]
      is_control: true
      purpose: >-
        Iso-parameter iso-token iso-corpus full-attention transformer with lambda 0,
        using the registered small-transformer config lineage without loading weights;
        descriptive architecture reference.
    - name: hybrid-no-bitext-a5
      mode: matched-from-scratch
      model_ids: [delta-net-1.3b-8k]
      is_control: true
      purpose: >-
        Iso-token monolingual-only stream replacing bitext, lambda 0; runs the
        bitext-exposure contrast live against A0.
    - name: dense-projection-alignment-a4-prime
      mode: matched-from-scratch
      model_ids: [smollm2-135m]
      is_control: false
      purpose: >-
        Conditional arm: dense transformer with A2's projection-alignment loss on the
        corresponding layers; runs only if the smoke run measures at least 200K tok/s/GPU
        so it fits under 16 GPU-hours; otherwise deferred and no GDN-versus-softmax claim
        is made.

intervention:
  mechanism: >-
    For a bitext span pair behind a shared prefix c, compute per-head pure writes
    W(a|c) = S(c+a) - S_{v=0}(c,a) via two chunk_gated_delta_rule calls from
    initial_state S(c) (the second with values zeroed, keeping decay and erase), and
    add lambda times cosine plus InfoNCE (tau 0.07) between W^A and W^B to the LM
    loss on half the GDN heads, with at least two same-prefix random language-B
    negatives and at least two same-prefix entity-or-number-sharing hard negatives
    per anchor.
  trainable_components:
    - all parameters of the 57M from-scratch hybrid and dense models
    - GDN projections q k v beta alpha of the supervised head subset E receive the alignment gradient
  frozen_components:
    - Olmo and stand-in checkpoints in phase 0 (read-only state interventions)
    - tokenizer, data mixture proportions, prompt manifests and evaluation permutations after sealing
    - lambda and learning rate after selection on FLORES+ dev

data:
  train:
    source: >-
      FineWeb (En) and FineWeb-2 (deu_Latn, cmn_Hani, tha_Thai) monolingual text 75 percent;
      ParaCrawl v9 En-De, ParaCrawl bonus En-Zh and SCB-MT-EN-TH-2020 bitext presented as
      prefix-sharing pairs 20 percent; same-language synthetic recall curriculum with
      ParaCrawl keys and digit values 5 percent; 200M tokens per run
    identity: >-
      dataset repositories, revisions, shard lists, filters, normalization and pair hashes
      frozen and hashed before enablement; A5 stream replaces bitext with iso-token monolingual text
  development:
    source: FLORES+ dev split (997 multi-way sentences) for transport fitting, lambda and LR selection
    identity: dev sentence ids disjoint from devtest; never used for keys
  test:
    source: >-
      TP-MQAR-v2 prompts built from FLORES+ devtest (1,012 sentences) in En, De, Es with
      surface-disjoint and surface-shared key subsets, N in 8 32 128, digit-only values
    identity: prompt manifests, key ids, value codes and permutations hashed and sealed before any phase-1 run
    sealed: true
  contamination_checks:
    - exact and MinHash 5-gram deduplication of every FLORES+ sentence against all training streams
    - retrieval-impossible control at chance 1e-4 and value-permutation control per cell
    - subword-level surface filter (no shared subword of 4 or more characters) in addition to NFKC casefold token filter
    - digit value codes drawn per prompt and never present in the synthetic curriculum

controls:
  - name: same-layer-projection-alignment-a2
    matches: [layers, heads, loss-form, lambda, tau, same-prefix-negatives, pooling-shape, parameters, tokens, data-order, seed]
  - name: language-marginal-placebo-a3
    matches: [loss-form, lambda, prefix, parameters, tokens, data-order, seed]
  - name: dense-full-attention-a4
    matches: [parameters-within-3-percent, tokens, corpus, tokenizer, seed]
  - name: no-bitext-iso-token-a5
    matches: [tokens, languages, proportions, parameters, seed]
  - name: d-zero-matched-distractor-perturbation
    matches: [span-length, position-offset, layers, prompts]
  - name: rank-capped-transport-identity-and-rotation
    matches: [fitting-pairs, prefixes, rank-cap, heads]
  - name: mlneedle-oneruler-dense-baselines
    matches: [task-framing, languages]
  - name: qed-march-swa-sinks-if-recall-claim
    matches: [state-size, context-length]

primary_endpoint:
  metric: >-
    closure of the cross-lingual recall gap on surface-disjoint TP-MQAR-v2 keys at
    beyond-window positions, A1 minus A2, in EM points
  direction: maximize
  minimum_effect: 5.0
  unit_of_analysis: seed-paired arm difference with prompts clustered by FLORES+ key sentence
  aggregation: paired-by-seed mean difference with prompt-clustered bootstrap 95 percent interval and seed SD

statistics:
  seeds: [42, 43, 44]
  interval: >-
    paired-by-seed differences with prompt-clustered bootstrap 95 percent interval; three
    seeds are a kill screen (power 0.37 at 5 points for seed SD 3); plus two seeds under a
    new line if A0 gap seed SD exceeds 3 points
  multiplicity: one primary endpoint; Holm correction across the four pre-registered secondaries; phase-0 kills are pre-registered thresholds

falsifiers:
  - Kill if D-zero on the fact span exceeds the matched distractor-span perturbation by at most 10 points (state is not the carrier).
  - Kill if the frozen hybrid's gap G(8) is at most 3 points, or G(128)/G(8) is at least 2 (readout interference dominates).
  - Kill if rank-capped dual-form transport fitted on FLORES+ dev closes at least 80 percent of the gap (training redundant).
  - Kill if A1 does not beat A2 by at least 5 EM points paired over seeds, or any seed pair is opposite-signed.
  - Kill if A3 closes at least half of A1's closure, or closure appears only on surface-shared keys.
  - Kill if held-out LM loss is over 1 percent worse, mean write norm shrinks over 30 percent, or A5 equals A0 within 2 points while A1 beats only A5.

execution:
  enabled: false
  max_gpu_hours: 16
  gpus: 2
  checkpoint_to_persistent_storage: true
  fresh_job_resume_test: true
  checkpoint_interval_minutes: 15
  blocked_by:
    - no implementation of the W object, same-prefix negative sampler, TP-MQAR-v2 builder or CPU doctor exists
    - discovery image 127.0.0.1:5000/cotcodec-research@sha256:15d6abc06fa53ab466087a92107da9c58e469615e2f56a683fefd0a7600277f3 lacks flash-linear-attention; rebuild with fla>=0.5.2 sentencepiece datasets datasketch and re-pin by digest
    - allenai/Olmo-Hybrid-7B and allenai/Olmo-3-1025-7B are not in models/registry.yaml; qwen3.5-4b and qwen3-0.6b-base are stand-ins only
    - no compiled job manifest; scripts/submit_docker_research_job.py dry run not executed
    - parallel-data inventory absent from the repository; FLORES+ gated terms not yet accepted; FineWeb license not re-verified
    - throughput planning number 150K tok/s/GPU unmeasured; 50M-token smoke run required before the grid
    - no signed provider-distinct novelty or design review; blind discrimination against 2608.27115 not rerun

required_artifacts:
  - model and dataset license and immutable revision receipts including Olmo registry entries
  - sealed TP-MQAR-v2 prompt manifests with key-type labels, hashes and leakage-control results
  - prefix-floor tables for W and D on the frozen hybrid and fp64 identity doctor output
  - phase-0 intervention ledger: D-zero and matched perturbation, transport maps with ranks and controls, swaps, N-scaling EM and margin tables
  - per-run configs, throughput smoke ledger, LM-loss and bits-per-byte curves, seed-paired difference tables with clustered intervals
  - atomic checkpoint and fresh-job continuation equivalence report
