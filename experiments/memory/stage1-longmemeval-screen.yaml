  dtype: bfloat16
  eval_mode: true
  decoding:
    do_sample: false
    max_new_tokens: 64
    constrained_schema: answer_or_tool_json

memory_budget:
  primary_active_slots: 4
  diagnostic_active_slots: [2, 8]
  max_archive_reads_per_opportunity: 1
  max_retrieval_top_k: 4
  max_injected_tokens: 256
  charge_serialized_bytes: true
  charge_construction_calls: true

causal_design:
  serve_propensities: [0.50, 0.25, 0.10]
  paired_replay_fraction: 0.25
  candidates_per_episode: 1
  estimator: cross_fitted_aipw
  folds: 5
  assignment_before_continuation: true
  prefix_only_features: true

controls:
  matrix_execution: false
  executed_by_runner: [one-frozen-selection-bundle-per-contained-job]
  planned_aggregate_script: scripts/aggregate_memory_control_matrix.py
  require_identical_assignment_schedule_per_seed: true
  implementation_available:
    - bm25
    - dense-bge-retrieval
    - full-prefix-ceiling
    - raw-log-rrf
    - profile-expansion
    - lru
    - no-memory
    - recency
    - lexical
    - learned-next-use
    - temporal-graph
    - reference
  planned_controls:
    - frozen-causal-holdout-policy
  primary_claim_enabled: false

dense_bge_retrieval:
  control_id: dense-bge-retrieval
  system_id: dense-bge-retrieval-v1
  role: matched-raw-dense-retrieval-floor
  model:
    repository: BAAI/bge-small-en-v1.5
    revision: "5c38ec7c405ec4b44b94cc5a9bb96e735b38267a"
    dimensions: 384
    maximum_tokens: 512
    pooling: cls-l2-normalized-v1
    trust_remote_code: false
    require_full_model_receipt: true
  retrieval:
    document_fields: [entity_id, key, value]
    query_instruction: "Represent this sentence for searching relevant passages: "
    passage_instruction: null
    similarity: cosine-on-l2-normalized-vectors
    tie_break: [written_step_desc, source_record_id_asc]
    source_attribution_required: true
    budget_profile: matched
  execution:
    freeze_before_actor: true
    encoded_inputs_charged: true
    actor_network_access: false
    implementation_status: implemented-unit-tested-not-yet-full-benchmark-frozen
    publication_wave_admitted: false
    publication_wave_contract_registered: true
    publication_admission_blocker: >-
      A fresh full 500-task dense bundle has not yet been frozen from a clean,
      SBOM-bearing image or included in an administrator-signed claim wave.

eligibility_gates:
  minimum_valid_action_json_rate: 0.95
  maximum_aa_success_drift_points: 0.0
  require_exact_task_and_bundle_receipts: true
  require_zero_session_bleed: true

execution:
  seeds: [42, 43, 44]
  seed_semantics: assignment-sensitivity-not-independent-task-replication
  container_required: true
  scheduler_required: true
  require_frozen_selection_bundle: true
  gpus: 2
  max_gpu_hours: 8
  checkpoint_interval_minutes: 10
  checkpoint_on_preemption: true
  prove_fresh_job_resume: true
