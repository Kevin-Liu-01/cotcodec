schema_version: 1
study_id: memory-stage1-longmemeval-screen
stage: frozen_screen
description: >-
  Transport-and-safety actor smoke over a deterministically derived, immutable
  32-task panel from the full-haystack LongMemEval-S artifact. It includes two
  abstentions and has no cross-task session overlap. It is not the scientific
  system comparison: claim-bearing retrieval evaluation must run all 500 tasks
  in all-SERVE mode with the official semantic judge. Byte-exact success here is
  diagnostic only.

