description: >-
  Validate a framework-owned, immutable ReasoningBank-style procedural bank
  with an exact train/dev/test task-to-family manifest and the pinned local BGE
  encoder. This proves split enforcement, deterministic freezing/retrieval,
  model binding, containment, and accounting surfaces. It does not reproduce
  ReasoningBank quality or authorize an H100 actor study.

