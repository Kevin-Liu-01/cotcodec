description: >-
  Exercise Mnemo Cortex's exact pinned two-tier memory, Analyst lineage,
  deterministic cross-agent dream rollup, Passport promotion boundary, and
  fresh-process persistence in two clean network-disabled Linux containers.
  Positive controls establish smart-note classification, default raw-log
  hiding, explicit drill-down, derived-note lineage, and restart behavior.
  Kill tests preserve the official container's absent Git executable, observe
  whether Passport mutates pending state before its Git-backed acknowledgement,
  retry the same failed observation, inspect the primary memory purge surface,
  and bind the unpinned dependency/base-image provenance.

