schema_version: 1
name: stage3-memgpt-letta-native-lifecycle-doctor
status: registered-cpu-falsification
scientific_result: false
publication_ready: false
description: >-
  Exercise the exact pinned legacy Letta V1 server's public active-core block
  and inactive archive surfaces in two clean network-disabled Linux AMD64
  containers. Positive controls establish agent construction without provider
  calls, core-block mutation, archive write/read/delete, cross-organization
  isolation, and fresh-process persistence. Kill tests inject a system-message
  update failure after the block transaction, retry an identical archive write,
  delete an agent with owner-attached memory, explicitly delete the remaining
  memory resources, and scan stopped PostgreSQL storage for deleted plaintext.

