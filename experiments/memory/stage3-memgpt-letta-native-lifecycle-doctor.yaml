  next_gate: >-
    Admit only a newer immutable V1 server revision or an explicitly reviewed
    repair arm that makes core-block persistence and compiled prompt update one
    recoverable transaction, adds an idempotency key for archival writes,
    defines agent-owned versus shared-resource teardown, and provides physical
    purge or cryptographic erasure. Repeat this doctor before any actor-quality
    or paging-policy comparison. Evaluate the separate Letta Code local MemFS
    mechanism under its own contract rather than treating it as a repair.

claim_boundary: >-
  Exact pinned legacy Letta V1 public core-block and archival-memory lifecycle,
  official-image/source identity, organization isolation, fresh-process restart,
  injected message-update failure semantics, payload-equivalent write retry,
  agent/resource deletion, stopped PostgreSQL plaintext scan, and matched local
  operation diagnostics; not semantic memory quality, autonomous paging policy,
  live model behavior, concurrent serving, managed Letta Cloud, the separate
  Letta Code MemFS runtime, secure media erasure, H100 quality, or publication
  evidence.
