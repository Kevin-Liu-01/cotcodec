    docker.io/library/python:3.12.11-slim-bookworm@sha256:519591d6871b7bc437060736b9f7456b8731f1499a57e22e6c285135ae657bf7
  python_version: 3.12.11
  clean_state_repeats: 2
  fresh_process_restarts_per_repeat: 3
  dependency_install: exact-committed-direct-requirements-no-transitive-lock

intervention:
  public_api:
    - MemForest.register_user
    - MemForest.ingest_session
    - MemForest.delete_session
    - MemForest.save
  external_model_calls: 0
  provider_calls: 0
  deterministic_chat_double: true
  deterministic_embedding_double: true
  test_normal_tenant_crud_restart: true
  test_saved_session_deletion_restart: true
  test_relative_user_path_confinement: true
  test_absolute_user_path_confinement: true
  test_alias_equivalent_user_isolation: true
  test_interrupted_multifile_save_restart: true
  test_native_tenant_purge_surface: true
  test_post_delete_plaintext_residue: true
  matched_incremental_vs_clean_rebuild_diagnostic: true

expected_falsification:
  status: MEMFOREST_LIFECYCLE_ADMISSION_KILLED_UNCONFINED_TENANT_PATH_AND_TORN_SNAPSHOT
  normal_user_survives_restart: true
  saved_session_delete_survives_restart: true
  relative_user_id_escapes_snapshot_root: true
  absolute_user_id_overrides_snapshot_root: true
  alias_equivalent_user_ids_share_storage: true
  interrupted_save_exposes_mixed_component_generations: true
  native_tenant_purge_absent: true
  write_path_diagnostic_completed: true
  reproduced_in_two_clean_states: true

execution:
  repetitions: 2
  external_api_calls: 0
  llm_calls: 0
  gpus: 0
  max_gpu_hours: 0
  wall_clock_limit_minutes: 20
  synthetic_seed_sessions: 4
  synthetic_incremental_sessions: 1

admission:
  h100_actor: forbidden-for-this-revision-if-falsified
  scientific_claim: forbidden
  publication_claim: forbidden
  next_gate: >-
    Admit only a newer immutable revision or an explicit reviewed repair arm
    with canonical tenant-ID validation, snapshot-root confinement, a native
    tenant purge, and atomic generation or journal recovery. Repeat the same
    doctor before any common-construction retrieval or H100 mechanism cell.

claim_boundary: >-
  Exact pinned public MemForest tenant registration, deterministic-fake ingest,
  save, restart, saved session deletion, tenant-path confinement, interrupted
  multi-file save recovery, native tenant-purge surface, bounded current-file
  plaintext scan, and synthetic incremental-versus-rebuild write diagnostics;
  not model extraction quality, semantic retrieval quality, secure filesystem
  erasure, sustained serving throughput, localized-maintenance causal effect,
  H100 actor quality, or publication evidence.
