schema_version: 1
name: stage3-memforest-native-lifecycle-doctor
status: registered-cpu-falsification
scientific_result: false
publication_ready: false
description: >-
  Exercise MemForest's exact public multi-user lifecycle in two clean,
  network-disabled ARM64 containers with deterministic local chat and embedding
  doubles. Normal tenant CRUD and restart are positive controls. Relative,
  absolute, and alias-equivalent user IDs probe snapshot-root confinement; a
  forced exception between component writes probes atomic generation recovery;
  saved deletion is followed by restart and bounded plaintext scans. A matched
  incremental-versus-clean-rebuild micro-workload is retained only as a
  non-scientific write-path diagnostic.

