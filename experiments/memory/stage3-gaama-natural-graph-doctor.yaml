schema_version: 1
name: stage3-gaama-natural-graph-doctor
description: >-
  Natural held-out LoCoMo evidence-retrieval falsifier for GAAMA-style typed
  graph PPR versus flat BM25 and three label-free degree-preserving shuffled
  graphs over the identical dialogue-node candidate pool.
study_id: gaama-natural-heldout-graph-retrieval-v1

source:
  repository: https://github.com/swarna-kpaul/gaama
  revision: 2d992f7f7b97c802bfe4c799878a5477cac1b6ff
  tree: 0227970b58617696afd53d27f920a10e3c401ece
  git_archive_tar_sha256: d9aec03fe4a268bf091dc2c419e270720e5cfffcdcbdfdd9e43b62bec00a4e9d
  license: MIT
  license_sha256: 59919d6d9afe4d7525ecfd24f2bd22d54f9184044d55a9f87044816f5f5dc131
  pagerank_sha256: 07ff41e2dea5a778dc8a1326a73c5d76396c22ddec088faa7fbe0174bbe499e4
  retriever_sha256: 682527f82409bdf5ccd4d4261a131c7ded38d96475df71ffa1038ba868221e41
  locomo10_sha256: 79fa87e90f04081343b8c8debecb80a9a6842b76a7aa537dc9fdf651ea698ff4
  locomo10_license: CC-BY-NC-4.0

runtime:
  base_image: docker.io/library/python:3.12.11-slim-bookworm@sha256:519591d6871b7bc437060736b9f7456b8731f1499a57e22e6c285135ae657bf7
  local_platform: linux/arm64
  network_mode: none
  read_only_root: true
  cap_drop_all: true
  no_new_privileges: true
  user: "65532:65532"
  cpu_limit: 2
  memory_limit: 4g
  gpu_count: 0
  timeout_seconds: 900
  clean_repetitions: 2

contract:
  dev_sample_ids: [conv-26, conv-30, conv-41]
  test_sample_ids: [conv-42, conv-43, conv-44, conv-47, conv-48, conv-49, conv-50]
  categories: [1, 2, 3, 4]
  expected_dev_questions: 382
  expected_test_questions: 1146
  expected_dialogue_nodes: 5882
  candidate_node_kind: dialogue-turn
  indexed_fields: [session-date, speaker, text]
  graph_edges: [in-session, next-turn]
  ppr_weights: [0.0, 0.05, 0.1, 0.25, 0.5, 1.0]
  ppr_alpha: 0.6
  shuffle_seeds: [42, 43, 44]
  bm25_k1: 1.2
  bm25_b: 0.75
  primary_metric: evidence-recall-all-at-10
  bootstrap_seed: 20260814
  bootstrap_draws: 10000
  model_calls: 0
  embedding_calls: 0
  require_dev_only_weight_selection: true
  require_identical_output_candidate_pool: true
  require_graph_degree_and_candidate_receipt: true
  require_ppr_zero_equal_flat: true
  require_no_answer_or_evidence_in_features: true

gates:
  valid_statuses: [GAAMA_NATURAL_GRAPH_PASS, GAAMA_NATURAL_GRAPH_KILLED]
  integrity_gates_must_all_pass: true
  pass_true_minus_flat_minimum: 0.01
  pass_true_minus_mean_shuffled_minimum: 0.01
  pass_clustered_ci_lower_must_exceed: 0.0
  pass_sign_randomization_p_maximum: 0.05
  pass_shuffled_clustered_ci_lower_must_exceed: 0.0
  pass_shuffled_sign_randomization_p_maximum: 0.05
  h100_admission: separate-design-review-only-after-pass

claims:
  scientific_result: false
  publication_ready: false
  supports: >-
    A natural retrieval-only same-dialogue-node estimate of typed structural
    graph PPR versus flat lexical ranking under the registered split and cost.
  does_not_support: >-
    GAAMA answer quality, generated semantic-node quality, GEL, agent-task
    success, graph-memory superiority in general, or publication-ready evidence.
