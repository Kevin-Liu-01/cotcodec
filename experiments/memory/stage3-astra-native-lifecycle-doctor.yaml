schema_version: 1
name: stage3-astra-native-lifecycle-doctor
status: registered-h100-lifecycle-falsification
scientific_result: false
description: >-
  Exercise ASTRA's native CockroachDB-backed working-set lifecycle without an
  LLM: bounded active-window eviction, durable retrieval-driven re-admission,
  acknowledged session persistence, forced database-process restart, user
  isolation, duplicate writes, soft deletion, and all-pinned overflow. This is
  an admission doctor, not memory-quality evidence.

