description: >-
  Admit the standalone Hermes Observational Memory provider separately from the
  sealed eight bundled providers plus Memori. Verify exact install and Hermes
  discovery, bounded startup push, BM25 pull retrieval, explicit note storage,
  fresh-process restart, isolated roots, hard-budget refusal, and retained-file
  residue. This is a lifecycle and transport falsifier, not a quality study.

