# AM1 study (D104; dossier entry 3 of program/evidence/2026-10-14/question-sweep-memory-gpu/
# dossier.md, with AM2's placebo arms and AM6's internal signals folded in), after Step 0 (D107).
#
# This file drives the DEVELOPMENT-SET PILOT, which is EXPLORATORY: no decision rule and no
# confirmatory claim. It runs on the development split only (experiments/am1/
# memcredit-split-v1.json, about 15% of LongMemEval-S's usable questions, seeded). The held-out
# split is opened only by a frozen registration (program/preregistrations/am1-memory-credit-v1.md,
# a DRAFT here); scripts/memcredit_study_prepare.py refuses it otherwise. Cap: 2 physical GPU-h in
# all, image build included.
#
# One GPU job (scripts/memcredit_study.py run, cotcodec-vllm cu129 overlay, vLLM 0.31.0, 2 H100):
#   phase reader: the Qwen3-8B reader in batch-invariant mode on every request of every pool
#     (the exact 2^8 subset table, AM2's placebo swaps and reorders), canonical order on GPU 0 and
#     a shuffled replicate on GPU 1 (the cross-GPU A/A);
#   phase judge: every distinct (question, reply) and the judge-validation items scored by the
#     Qwen3-32B judge in batch-invariant mode with LongMemEval's own answer-check prompt, canonical
#     on GPU 0 and shuffled on GPU 1 (the judge's A/A);
#   phase extra: the same judge items scored by Qwen3-8B (an inter-judge agreement check) on GPU 0,
#     and AM6's attention signals (HF transformers, eager attention, Qwen3-8B teacher-forced on
#     each full pool and its greedy reply) on GPU 1.
# scripts/memcredit_analyze.py (CPU) then computes the tables' set functions, the credit
# estimators, keep-set regret, the placebo analysis, the internal-signal analysis, the judge's
# validation and the power simulation for the registration.
schema_version: 1
experiment_id: memcredit-study-v1
claim_level: exploratory

# Declared before the run. 42: the split, the gold arm's distractors, engine seeds, permutation
# Shapley and SNIPW draws (with 43 and 44), the hand-check sample's first stratum draw; 43: the
# shuffled pass orders, the reorder placebo, the cross-fitting folds; 44: the hand-check sample
# and the cross-question negatives of the judge validation.
seeds: [42, 43, 44]

source:
  dataset: xiaowu0162/longmemeval-cleaned
  file: longmemeval_s_cleaned.json
  revision: "98d7416c24c778c2fee6e6f3006e7a073259d48f"
  sha256: "d6f21ea9d60a0d56f34a05b609c79c88a451d2ae03597821ea3d5a9678c3a442"
  size_bytes: 277383467
  license: MIT

# Usable questions: Step 0's census definition (census/census-e87a6c1a.json, 416 of 500): no
# abstention question, every gold turn a user turn, 1 to 6 gold turns. Every question type is kept.
usable:
  exclude_abstention: true
  gold_roles: [user]
  min_gold_turns: 1
  max_gold_turns: 6
  pool_size: 8

# The split: per question type (sorted ids), random.Random(f"{seed}:{type}").shuffle, the first
# round_half_up(fraction * n) ids are development, the rest held out.
split:
  seed: 42
  development_fraction: 0.15
  path: experiments/am1/memcredit-split-v1.json

retriever:
  name: bm25-okapi-lucene-idf
  unit: user-turn
  k1: 1.5
  b: 0.75

# Step 0's two arms. retrieved: the BM25 top 8 user turns (the deployable pool). gold: every gold
# user turn plus distractors drawn uniformly (seed 42, per question) from the other user turns
# (the identification pool). Chronological order; bit i of a mask keeps memory i.
pools:
  size: 8
  arms: [retrieved, gold]
  max_memory_chars: 1500
  distractor_seed: 42

# AM2's content-placebo arms, per pool:
#   swap: for each slot i, two variants that keep slot i's position and date and replace its
#     text with a non-gold user turn of the same question that is in neither arm's pool, matched
#     on length (|log(chars ratio)| within the first tolerance that leaves >= 2 candidates) and
#     then on BM25 rank (nearest rank to memory i's), ties by length gap, session, turn;
#   reorder: the full pool reversed, and the full pool in a seeded permutation (seed 43).
placebo:
  swap_variants: 2
  length_log_tolerances: [0.2231435513, 0.4054651081, 0.6931471806]  # ln 1.25, ln 1.5, ln 2
  reorder_seed: 43

# Step 0's reader prompt, unchanged.
prompt:
  enable_thinking: false
  no_memories: "(none)"
  user: |-
    Below are memories from your earlier conversations with the user. Each memory is something the user said, with the date of that conversation. Some memories may be irrelevant.

    Memories:
    {memories}

    Current date: {question_date}
    Question: {question}

    Answer the question in one short sentence using the memories. If they do not contain the answer, say "I don't know".

reader:
  model_id: qwen3-8b
  revision: "b968826d9c46dd6066d109eabc6255188de91218"
  receipt_root: cotcodec-receipts-cpu-lane
  engine:
    dtype: bfloat16
    max_model_len: 4096
    gpu_memory_utilization: 0.85
    max_num_seqs: 256
    max_num_batched_tokens: 8192
    enable_prefix_caching: true
    logprobs_mode: raw_logprobs
  sampling: {temperature: 0.0, max_tokens: 64, logprobs: 0}

# The judge. LongMemEval's official answer check: get_anscheck_prompt in src/evaluation/
# evaluate_qa.py of github.com/xiaowu0162/LongMemEval at 9e0b455f4ef0e2ab8f2e582289761153549043fc
# (MIT), ported word for word in harness/memcredit_study.py (judge_prompt; the test checks it
# against the archived port legacy/harness/memory_trials/longmemeval_judge.py, which pinned the
# evaluator's SHA-256 ecce9c4c...). The official judge is gpt-4o-2024-08-06 at T 0 and 10 tokens;
# here an open dense model in vLLM's batch-invariant mode, greedy, 10 tokens, thinking off. The
# label is the official rule: "yes" occurs in the reply, case-folded.
judge:
  prompt_version: longmemeval-evaluate-qa-get-anscheck-prompt-v1@9e0b455f
  primary:
    model_id: qwen3-32b
    revision: "9216db5781bf21249d130ec9da846c4624c16137"
    receipt_root: cotcodec-receipts
    engine:
      dtype: bfloat16
      max_model_len: 4096
      gpu_memory_utilization: 0.92
      max_num_seqs: 128
      max_num_batched_tokens: 8192
      enable_prefix_caching: true
      logprobs_mode: raw_logprobs
  secondary:
    model_id: qwen3-8b
    revision: "b968826d9c46dd6066d109eabc6255188de91218"
    receipt_root: cotcodec-receipts-cpu-lane
    engine:
      dtype: bfloat16
      max_model_len: 4096
      gpu_memory_utilization: 0.85
      max_num_seqs: 256
      max_num_batched_tokens: 8192
      enable_prefix_caching: true
      logprobs_mode: raw_logprobs
  sampling: {temperature: 0.0, max_tokens: 10, logprobs: 0}
  enable_thinking: false
  # Validation items, per development question: the reference answer as the response (expected
  # yes), "I don't know." (expected no) and the reference answer of another development question
  # of the same type (a seeded derangement, seed 44; expected no; skipped for a type with one
  # question).
  validation:
    idk_response: "I don't know."
    derangement_seed: 44
  # The hand check: a seeded sample of judged real replies, stratified by the primary judge's
  # label and question type, read and labelled from the question, the reference answer and the
  # reply alone (blind to the judges' labels).
  hand_check:
    size: 120
    seed: 44

# AM6's internal signals: HF transformers (in the image), Qwen3-8B in bf16 with eager attention,
# one teacher-forced forward per pool of the full prompt plus the reader's greedy reply. For each
# layer and head, the attention mass from the positions that predict the reply tokens onto each
# memory's tokens (mean over those query positions).
internal:
  model_id: qwen3-8b
  attn_implementation: eager
  dtype: bfloat16
  xfit_heads: 16
  xfit_seed: 43

analysis:
  keep_budgets: [1, 2, 3, 4]
  headline_budget: 4
  permutation_shapley: [4, 16]
  snipw_exposures: [64]
  estimator_seeds: [42, 43, 44]
  bootstrap: {resamples: 4000, seed: 42}
  power: {simulations: 2000, seed: 43}

# The development pilot's job (2 H100). phases run in order; a phase starts only with min_start_s
# left before the deadline; max_s bounds each worker's passes.
job:
  gpus: 2
  minutes: 40
  phases:
    - id: reader
      min_start_s: 600
      workers:
        - {id: reader-gpu0, kind: reader, gpu: 0, order: canonical, max_s: 900}
        - {id: reader-gpu1, kind: reader, gpu: 1, order: shuffled, max_s: 900}
    - id: judge
      min_start_s: 480
      workers:
        - {id: judge32-gpu0, kind: judge, judge: primary, gpu: 0, order: canonical, max_s: 600}
        - {id: judge32-gpu1, kind: judge, judge: primary, gpu: 1, order: shuffled, max_s: 600}
    - id: extra
      min_start_s: 300
      workers:
        - {id: judge8-gpu0, kind: judge, judge: secondary, gpu: 0, order: canonical, max_s: 420}
        - {id: attention-gpu1, kind: attention, gpu: 1, max_s: 600}
  shuffle_seed: 43

budget:
  total_physical_gpu_hours: 2.0
