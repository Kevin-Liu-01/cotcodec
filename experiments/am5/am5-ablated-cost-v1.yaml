# am5-ablated-cost-v1 (D121; CONFIRMATORY once frozen in the ledger): is the non-abstention keep
# rule's cost on questions whose evidence is absent below its gain on the same questions with their
# evidence? Registration: program/preregistrations/am5-ablated-cost-v1.md. Script:
# scripts/memcredit_am5r.py.
#
# The rule (AM1d's nonabstain@70 with AM4's read cap K): read a pool's 4-subsets in BM25 order and
# keep the first whose reply does not abstain (AM1d's four patterns, digest 031bee27...) within K
# reads; otherwise keep BM25 top 4. Primary K = 8, secondary K = 70.
#
# Two populations, each one GPU job (memcredit_am5r.py run --population P) on one H100 in the
# cotcodec-vllm cu129 overlay built from the commit's source capsule:
# - heldout: AM1's 347 held-out answerable questions, each with its evidence sessions
#   (answer_session_ids) removed and the BM25 top-8 user-turn pool built from the rest with AM1's
#   retrieved-arm functions (prepare-heldout, host CPU, before the freeze); AM5's 63 development
#   ablated pools follow in the same artifact and job as the replay control (V3);
# - development: the pre-freeze dry run on AM5's 63 development ablated pools (exploratory).
# Per pool every reader answers the 70 4-subsets and the full pool (71 requests) with AM1's
# prompt, greedy, 64 tokens; then the Qwen3-32B judge scores every distinct (question, reply) with
# LongMemEval's non-abstention answer-check prompt against the reference answer.
schema_version: 1
experiment_id: am5-ablated-cost-v1
claim_level: confirmatory
# 42: every engine seed and the bootstrap seed. 44: the blind hand check's draws. 43 is unused; the
# lane's seed-matrix contract binds three seeds to --seeds.
seeds: [42, 43, 44]

