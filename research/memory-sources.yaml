    limitations:
      - The official implementation has no tests or lock and targets a stale 2023 dependency stack, so it should not be imported as a publication baseline.
      - Its forgetting expression is math.exp(-t / 5*S), which makes larger S accelerate forgetting despite adjacent documentation stating that larger strength slows forgetting; any control must preregister and test a corrected formula.
      - The upstream loader destructively deletes records using unseeded randomness, and every recall-strength increment increases deletion probability under the buggy expression; a corrected control must use immutable input copies and seeded randomness and cannot be labeled upstream-faithful reproduction.
