  lightmem:
    kind: system
    title: "LightMem"
    observed_on: "2026-08-13"
    primary_sources:
      - https://arxiv.org/abs/2510.18866
      - https://github.com/zjunlp/LightMem
    repositories:
      - role: implementation
        url: https://github.com/zjunlp/LightMem
        revision: 8fc9a9179f9170c4a40fc653fcb410375900f26e
        license: MIT
    memory_layers: [episodic_log, semantic_profile, controller]
    residency_transition: none
    mechanism: >-
      Uses lightweight sensory filtering, topic-aware short-term consolidation,
      and an offline sleep-time update path for long-term memory.
    use_as: [offline-consolidation-negative-control, sensory-buffer-reference]
    evidence_grade: local-negative-reproduced
    reproduction_receipt:
      artifact_path: research/evidence/memory/lightmem-offline-negative-v1.json
      receipt_sha256: 2c99c194c941725ffbf6b52e4f89ba424257a133de993798fb3de801b545d349
    limitations:
      - Offline consolidation changes freshness and amortization assumptions.
      - Two clean network-disabled Docker repetitions reproduced that the documented online update path is a no-op and that the default local Qdrant reopen deletes an existing store.
      - The official offline-update script omits the persistence flag and the automatic trigger calls the consolidation method with an unsupported keyword.
      - Consolidation changes the memory payload without re-embedding it, leaving semantic retrieval indexed by stale text.
      - Context-only retrieval still dereferences embedding components; source-event lineage and a native scoped purge surface are absent.
      - LLMLingua, embedding, and LLM calls must all be charged in matched runs.
      - The root license is MIT while package metadata declares Apache-2.0; resolve this conflict before reuse.
      - Do not run an H100 actor for this revision; admit only a newer pin or explicit repair arm that passes the same two-clean-state lifecycle doctor.

