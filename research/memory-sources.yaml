schema_version: 1
verified_at: "2026-08-15"
scope: >-
  Primary-source and official-code ledger for long-lived memory in tool-using
  language-model agents. Reported benchmark numbers are evidence about a
  particular implementation and evaluation, not proof of a general memory
  mechanism.

controlled_vocabulary:
  memory_layers:
    - active_context
    - inactive_archive
    - episodic_log
    - semantic_profile
    - temporal_graph
    - procedural_memory
    - latent_state
    - controller
  evidence_grades:
    - mechanism-only
    - paper-reported
    - vendor-reported
    - open-harness-reported
    - externally-reproduced
    - local-reproduced
    - local-conformance-reproduced
    - local-negative-reproduced
  evidence_grade_definitions:
    mechanism-only: "Code or specification inspected; no result artifact is admitted."
    paper-reported: "Empirical claim appears in a paper but is not independently reproduced here."
    vendor-reported: "Empirical claim appears only in a vendor or project report."
    open-harness-reported: "Open harness or result bytes exist, but no independent reproduction is admitted."
    externally-reproduced: "Independent external reproduction is bound by a receipt."
    local-reproduced: "CoTCodec reproduction is bound by a receipt."
    local-conformance-reproduced: "CoTCodec reproduced an interface, transport, or lifecycle conformance result, not a scientific quality result."
    local-negative-reproduced: "CoTCodec reproduced a bounded negative invariant or falsifier, not a scientific quality result."
  residency_transitions:
    - not-reviewed
    - none
    - bidirectional-residency
    - active-to-inactive
    - inactive-to-active
    - manual-promotion
    - chronological-context-paging
    - one-way-consolidation
    - representation-only
    - separate-stores-no-transition
  graph_semantics:
    - none
    - generic
    - temporal-validity
    - causal
    - multi-graph

sources:
  memgpt-letta:
    kind: system
    title: "MemGPT / Letta"
    observed_on: "2026-08-11"
    primary_sources:
      - https://arxiv.org/abs/2310.08560
      - https://github.com/letta-ai/letta
      - https://github.com/letta-ai/letta-code
    repositories:
      - role: implementation
        url: https://github.com/letta-ai/letta
        revision: ff19ffeafeb54bd2a7dc5d4a552f10191732a235
        license: Apache-2.0
      - role: current-agent-runtime
        url: https://github.com/letta-ai/letta-code
        revision: a575e11753943d9a4e18373a8817eb16a5b76b47
        license: Apache-2.0
    memory_layers: [active_context, inactive_archive, episodic_log, controller]
    residency_transition: bidirectional-residency
    mechanism: >-
      Virtual-context paging: a small always-visible core memory is edited by
      the agent while recall and archival stores remain outside the prompt and
      are accessed through explicit tools.
    use_as: [active-inactive-baseline, self-managed-memory-baseline]
    evidence_grade: mechanism-only
    limitations:
      - Self-directed paging can spend model calls on memory administration.
      - Storage and retrieval do not by themselves solve deduplication, temporal validity, or consolidation.

