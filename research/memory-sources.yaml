    evidence_grade: paper-reported
    limitations:
      - The pinned repository has no root license, so code reuse is blocked until licensing is resolved.
      - ALFWorld, ScienceWorld, and WebShop drivers have different environment and actor dependencies; paper results are not one matched memory-only comparison.
      - Residual reconstruction can accumulate stale or conflicting deltas and requires explicit source, invalidation, and rollback tests.

  h-mem:
    kind: hybrid-tree-graph-memory-system
    title: "H-Mem"
    observed_on: "2026-08-13"
