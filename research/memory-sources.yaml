  neo4j-agent-memory:
    kind: sessioned-knowledge-graph-and-reasoning-system
    title: "Neo4j Agent Memory"
    observed_on: "2026-08-14"
    primary_sources:
      - https://github.com/neo4j-labs/agent-memory
    repositories:
      - role: python-implementation-tests-eval-harness-and-no-llm-example
        url: https://github.com/neo4j-labs/agent-memory
        revision: 231d60eac9401ab156ba194b519d89dd644dadb8
        license: Apache-2.0
    memory_layers: [inactive_archive, episodic_log, semantic_profile, temporal_graph, controller]
    graph_semantics: generic
    mechanism: >-
      Separates short-term sessions, long-term entities, preferences, and facts,
      and reasoning and tool traces; supports multi-stage local or LLM
      extraction, explicit reasoning-to-entity audit edges, consolidation and
      deduplication, multi-tenant scoping, buffered writes, graph export, and a
      no-generative-LLM path. Preference supersession creates a native
      `SUPERSEDED_BY` edge, closes the old node's `valid_until`, and exposes
      current `active_only` and historical `as_of` views.
    use_as: [sessioned-knowledge-graph-control, reasoning-audit-control, no-llm-graph-lifecycle-control, preference-supersession-lifecycle-control, identical-tuple-traversal-component-control]
    evidence_grade: local-conformance-reproduced
    reproduction_receipt:
      artifact_path: research/evidence/memory/neo4j-preference-lifecycle-local-arm64-v1.json
      receipt_sha256: 98a21ee7fcb19d40d9fe55992da80c7fa8e9ebc9b7d858827e545a3a443dcb35
    cluster_confirmation_receipt:
      artifact_path: research/evidence/memory/neo4j-preference-lifecycle-h100-v1.json
      receipt_sha256: dfeaf75011c088d9b34c2a803798f4b237499ddbde653e3459350bdcd36b2350
    cluster_component_receipt:
      artifact_path: research/evidence/memory/neo4j-identical-tuple-flat-parity-h100-v1.json
      receipt_sha256: e09d16388bf084de41b6f37515befb80f111dcb14249c174292ec57f5faa2b8e
    limitations:
      - It is a reusable systems package rather than a controlled graph-versus-flat scientific comparison; built-in tests and evals do not establish graph efficacy.
      - Extractor choice changes the information stored, so a graph claim requires identical pre-extracted tuples and embeddings in the Neo4j and flat arms.
      - Self-hosted behavior is the registered estimand; hosted NAMS extraction and serving are a different system and must not be mixed into the same cell.
      - A historical `as_of` lookup must set `active_only=false`; the default active topology filter otherwise excludes superseded nodes.
      - Two local arm64 and two cluster amd64 Docker repetitions passed preference supersession, historical as-of retrieval, idempotent retry, retained-volume restart, user isolation, and purge with zero model calls; the cluster job held one H100 allocation but passed no GPU into either container.
      - The locked no-LLM client requires the upstream `nams` dependency extra because importing the Bolt store traverses the package initializer and imports `httpx`; that packaging coupling is recorded rather than hidden.
      - Cluster scheduler accounting storage was disabled, so the batch, GPU inventory, source/image/SBOM receipts, output hash graph, and failed preflight logs are retained while publication readiness remains false.
      - >-
        Slurm job 304 passed the designed identical-tuple component: true
        traversal and the flat SQL join ceiling recovered 48/48, while flat
        BM25+dense and object-degree-preserving shuffled topology recovered
        0/48. This isolates traversal on the fixture but explicitly does not
        show that Neo4j uniquely enables joins or improves natural-data,
        answer, or agent quality.
      - A natural identical-evidence frozen-actor contract, clean source, and complete control admission are still required before quality work; this does not establish autonomous consolidation or bidirectional active/inactive paging.

  longmemeval-natural-session-topology:
    kind: registered-natural-topology-falsifier
    title: "LongMemEval natural chronological-session topology screen"
    observed_on: "2026-08-15"
    primary_sources:
      - https://huggingface.co/datasets/xiaowu0162/longmemeval-cleaned
      - https://github.com/xiaowu0162/LongMemEval
    artifacts:
      - role: full-haystack-natural-topology-input
        url: https://huggingface.co/datasets/xiaowu0162/longmemeval-cleaned/resolve/98d7416c24c778c2fee6e6f3006e7a073259d48f/longmemeval_s_cleaned.json?download=true
        revision: 98d7416c24c778c2fee6e6f3006e7a073259d48f
        filename: longmemeval_s_cleaned.json
        sha256: d6f21ea9d60a0d56f34a05b609c79c88a451d2ae03597821ea3d5a9678c3a442
        size: 277383467
        license: MIT
    memory_layers: [inactive_archive, episodic_log, temporal_graph, controller]
    graph_semantics: generic
    mechanism: >-
      Freezes 64 knowledge-update and temporal-reasoning questions from the
      immutable LongMemEval-S artifact, ranks identical full-session evidence
      with model-free BM25+dense RRF, and spends two of four retrieval slots on
      chronological neighbors of the top two flat seeds. Three deterministic
      chain shuffles preserve every session node's degree. Labels are used only
      after ranking to compute official-style recall-all@4.
    use_as: [chronological-topology-negative-control, graph-to-actor-admission-falsifier]
    evidence_grade: local-negative-reproduced
    reproduction_receipt:
      artifact_path: research/evidence/memory/longmemeval-natural-session-topology-negative-v1.json
      receipt_sha256: 2d2849d1652f0e9e7dffa66e674f177b7f0a5ac8183fbb455fda34b5aa4d556f
    limitations:
      - Two byte-identical network-disabled ARM64 Docker repetitions returned flat BM25+dense recall-all@4 of 0.34375 and true chronological topology recall of 0.203125; the paired stratified-bootstrap true-minus-flat interval was [-0.234375, -0.046875].
      - True chronology did not beat the mean of three degree-preserving shuffled chains, so the preregistered topology-to-actor escalation is killed and no H100 model run is admitted from this screen.
      - The frozen input is natural LongMemEval dialogue, but the stable vectors and neighbor-expansion rule are deterministic controls rather than Neo4j Agent Memory extraction or retrieval. The result does not measure native storage, answer quality, or general graph-memory efficacy.
      - The exact worktree was mounted read-only into a pinned older doctor image, so the result is deterministic development evidence with scientific_result=false and publication_ready=false, not clean-source publication provenance.

