    use_as: [temporal-graph-baseline, contradiction-and-expiry-control]
    evidence_grade: mechanism-only
    limitations:
      - Ingestion requires model calls and a graph backend.
      - Graph extraction accuracy and retrieval policy must be evaluated separately.

  graphiti-native-lifecycle-adapter:
    kind: native-lifecycle-adapter
    title: "Graphiti 0.29.3 explicit-triplet lifecycle adapter"
    observed_on: "2026-08-15"
    primary_sources:
      - https://github.com/getzep/graphiti
    repositories:
      - role: pinned-upstream-runtime
        url: https://github.com/getzep/graphiti
        revision: 401c59a65bdeb22a44136901ff30231e6998a7fe
        license: Apache-2.0
    memory_layers: [inactive_archive, episodic_log, temporal_graph, controller]
    graph_semantics: temporal-validity
    mechanism: >-
      A task-blind memory-lifecycle-v1 adapter writes explicit entity-relation
      triplets through Graphiti into one session-scoped FalkorDBLite database,
      with deterministic embeddings, native restart verification, branch
      isolation, lineage receipts, and adapter-scoped purge.
    use_as: [native-lifecycle-admission-negative, temporal-graph-adapter-control]
    evidence_grade: local-negative-reproduced
    reproduction_receipt:
      artifact_path: research/evidence/memory/graphiti-falkordblite-arm64-v2.json
      receipt_sha256: 6664df62075c190d9e1a257ddae08a932ac8bad37173826cf6920a6727b66102
    limitations:
      - The contained ARM64 runtime never reaches lifecycle execution because FalkorDBLite 0.10.0 packages an x86-64 Falkor module beside an AArch64 Redis server.
      - H100 admission is forbidden for this revision and runtime; the negative does not measure Graphiti retrieval quality or full LLM extraction.
      - Host-only lifecycle tests passed through a development runtime and are not publication evidence.

  sodamem:
    kind: temporal-graph-system
    title: "SodaMem"
    observed_on: "2026-08-14"
    primary_sources:
      - https://arxiv.org/abs/2608.08055
      - https://github.com/SodaMem/SodaMem
    repositories:
      - role: implementation-and-benchmark-artifacts
        url: https://github.com/SodaMem/SodaMem
        revision: b182c1a603e47d82ee6e99190aa5022db28077b5
        license: Apache-2.0
    memory_layers: [inactive_archive, episodic_log, semantic_profile, temporal_graph, controller]
    graph_semantics: temporal-validity
    mechanism: >-
      Extracts provenance-bound typed FactEvents, stores mention, occurrence,
      and validity time, connects updates, contradictions, and supersessions,
      and retrieves citable evidence through a planner-reader loop over hybrid
      lexical, dense, and graph indexes.
    use_as: [evidence-grounded-temporal-graph-control, provenance-and-validity-control, native-system-candidate]
    evidence_grade: paper-reported
    benchmark_claims:
      - benchmark: LongMemEval-S
        result: "92.8% (464/500), reported best of three runs with deepseek-v4-flash"
        source_url: https://arxiv.org/abs/2608.08055
        evidence_grade: paper-reported
    limitations:
      - The reported best-of-three result uses the same Flash model as reader and judge, so self-grading and selection effects remain.
      - Reported cost excludes ingestion and judging; cross-system points are compiled estimates rather than one matched bake-off.
      - LongMemEval answers and evidence rows are present inside the pinned repository, but the result has not been independently rerun here.

