        url: https://github.com/vectorize-io/hindsight
        revision: f28a8458ed9457e2dce6e42558c1db6d1ab1cbfd
        license: MIT
      - role: benchmark
        url: https://github.com/vectorize-io/hindsight-benchmarks
        revision: 48375a6326712b1f3304dc3be5f34d7c6ae50767
        license: unresolved
    memory_layers: [episodic_log, semantic_profile, temporal_graph, controller]
    mechanism: >-
      Retain, recall, and reflect pipeline over facts, experiences, entities,
      relationships, time, and consolidated mental models in isolated memory banks.
    use_as: [reflective-memory-baseline, graph-plus-profile-baseline]
    evidence_grade: vendor-reported
    benchmark_claims:
      - benchmark: LongMemEval
        result: "83.6 with the authors' OSS-20B configuration; 89.0 with OSS-120B"
        source_url: https://github.com/vectorize-io/hindsight
        evidence_grade: vendor-reported
    limitations:
      - The authors maintain both the system and its benchmark harness.
      - No repository license was detected for the separate benchmark harness.
      - Reported scores require independent reproduction under matched model and judge settings.

