  timem:
    kind: temporal-hierarchical-consolidation-system
    title: "TiMem"
    observed_on: "2026-08-13"
    primary_sources:
      - https://arxiv.org/abs/2601.02845
      - https://github.com/TiMEM-AI/TiMEM
    repositories:
      - role: core-engine-only
        url: https://github.com/TiMEM-AI/TiMEM
        revision: 6d279a5f5d40ee229e1995df15c182cb2062c71c
        license: Apache-2.0
    memory_layers: [inactive_archive, episodic_log, semantic_profile, controller]
    mechanism: >-
      Organizes dialogue into a five-level Temporal Memory Tree from factual
      segments through sessions, days, weeks, and persona profiles. Online
      base-level writes and scheduled higher-level consolidation preserve
      temporal containment; a query-complexity planner selects hierarchy levels,
      dual lexical/dense retrieval activates leaves, and an LLM gate filters
      leaves and ancestors before answer generation.
    use_as: [fixed-temporal-hierarchy-control, ancestor-propagation-control, complexity-aware-recall-control]
    evidence_grade: local-negative-reproduced
    reproduction_receipt:
      artifact_path: research/evidence/memory/timem-core-runtime-negative-v1.json
      receipt_sha256: 742f0f6745aeef2599d1bc8a3f52f33b9c8be724aa7797ad34f41b0e247f2f1c
    benchmark_claims:
      - benchmark: LoCoMo
        result: "75.30% LLM-judge accuracy over 1,540 non-adversarial questions and 52.20% less recalled memory length than reported Mem0, paper-reported"
        source_url: https://arxiv.org/abs/2601.02845
        evidence_grade: paper-reported
      - benchmark: LongMemEval-S
        result: "76.88% LLM-judge accuracy, paper-reported"
        source_url: https://arxiv.org/abs/2601.02845
        evidence_grade: paper-reported
    limitations:
      - >-
        Two clean, byte-identical, network-disabled ARM64 Docker executions
        reproduced three pre-model core runtime defects: L1 instantiates its
        processor class as a fragment record, L2 constructs a local session
        dataclass with unsupported fields and returns None, and L5 omits
        required updated_at fields in both normal and fallback paths.
      - This exact revision is forbidden from H100 actor work. The negative is source-runtime evidence only; temporal-hierarchy quality, graph retrieval, and active/inactive residency were not evaluated.
      - The root license assigns Apache-2.0 to the core engine and MIT to tools, cloud-service, and docs, but does not map config, experiments, assets, or root artifacts; this ledger permits core-engine reuse only.
      - Consolidation and recall both use model calls, while the reported recall-length savings omit planner, gate, and offline consolidation tokens.
      - The paper describes matched top-20 recall, but pre-gating candidate budgets reach 35 and the final retained count is not reported.
      - The paper identifies forgetting as future work; recall-time filtering is not durable deletion or expiry.

  memforest:
    kind: hierarchical-temporal-index-system
    title: "MemForest"
    observed_on: "2026-08-13"
    primary_sources:
      - https://arxiv.org/abs/2605.23986
      - https://github.com/Concyclics/MemForest
    repositories:
      - role: implementation-benchmark-and-reproducibility-artifacts
        url: https://github.com/Concyclics/MemForest
        revision: fb4320a84d296bf7b0752d7ef1f2ad0726ae0b22
        license: MIT
    memory_layers: [inactive_archive, episodic_log, semantic_profile, controller]
    mechanism: >-
      Extracts canonical records in parallel, routes them into time-ordered
      session, entity, and scene trees, and refreshes only dirty ancestor paths
      and derived indexes. Query-time forest recall combines root and fact cues,
      then browses interval summaries down to leaf evidence; merge, deletion,
      and migration regenerate only affected derived artifacts.
    use_as: [write-path-efficiency-control, hierarchical-temporal-index-control, localized-maintenance-control]
    evidence_grade: paper-reported
    benchmark_claims:
      - benchmark: LongMemEval-S
        result: "79.8% pass@1 and approximately 6x memory-construction throughput versus reported stateful baselines"
        source_url: https://arxiv.org/abs/2605.23986
        evidence_grade: paper-reported
    limitations:
      - No result has been independently reproduced in this repository.
      - Full runs require separate chat, embedding, and judge models plus external benchmark data; released per-question outputs permit table recomputation but not end-to-end reproduction.
      - Throughput, retrieval, maintenance locality, and actor quality are coupled in the headline comparison and need separate matched cells.

  infini-memory:
    kind: topic-document-memory-system
    title: "Infini Memory"
    observed_on: "2026-08-13"
    primary_sources:
      - https://arxiv.org/abs/2606.10677
      - https://github.com/infinigence/Infini-Memory
    repositories:
      - role: implementation-and-examples
        url: https://github.com/infinigence/Infini-Memory
        revision: ddac08ec468e0382e4f14239d94991ab19ae981a
        license: Apache-2.0
    memory_layers: [inactive_archive, episodic_log, semantic_profile, controller]
    mechanism: >-
      Stores readable topic-oriented Markdown documents with entry-level time and
