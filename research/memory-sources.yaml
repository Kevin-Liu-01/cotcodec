    evidence_grade: paper-reported
    benchmark_claims:
      - benchmark: MemoryAgentBench
        result: "64.7% overall score, paper-reported"
        source_url: https://arxiv.org/abs/2606.10677
        evidence_grade: paper-reported
    limitations:
      - No result has been independently reproduced in this repository.
      - Rewrite, split, merge, and agentic retrieval add model calls whose latency and cost must be charged against simple Markdown and BM25 controls.
      - Topic documents are a maintenance representation, not evidence that the correct memory becomes active before an agent knows to search.

  deltamem:
    kind: residual-experience-tree-system
    title: "DeltaMem"
    observed_on: "2026-08-13"
    primary_sources:
      - https://arxiv.org/abs/2606.03083
      - https://github.com/import-myself/DeltaMem
    repositories:
      - role: implementation-and-benchmark-drivers
        url: https://github.com/import-myself/DeltaMem
        revision: 3d8cbe9c39ee9747bd8eea4013cdf14dff6c7ff8
        license: unresolved
    memory_layers: [inactive_archive, episodic_log, procedural_memory, controller]
    mechanism: >-
