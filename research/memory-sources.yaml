    limitations:
      - No official implementation repository was located from the paper or primary-source search at the observation cutoff.
      - The broad tree-plus-graph result does not isolate representation, consolidation, traversal, or actor contributions.
      - Reported benchmark gains remain paper claims and cannot enter a code-import portfolio without a licensed implementation.

  mempalace:
    kind: raw-log-and-hybrid-retrieval-system
    title: "MemPalace"
    observed_on: "2026-08-14"
    primary_sources:
      - https://github.com/MemPalace/mempalace
    repositories:
      - role: implementation-benchmarks-and-per-question-outputs
        url: https://github.com/MemPalace/mempalace
        revision: 906b918a7c6ebb2a9198a6bf5a78f30a173fea56
        license: MIT
    memory_layers: [inactive_archive, episodic_log, temporal_graph, controller]
    mechanism: >-
      The released raw LongMemEval runner builds one user-only document per
      session, recreates an ephemeral Chroma collection per question, and ranks
      sessions with the default all-MiniLM-L6-v2 ONNX embedder without a
      write-time LLM. Broader product paths expose persistence, hybrid retrieval,
      and temporal graph features, but those are not part of the raw control.
    use_as: [mandatory-raw-log-control, no-write-llm-control, optional-temporal-graph-control]
    evidence_grade: open-harness-reported
    limitations:
      - Two fresh current-lock 500-task direct runs reproduce byte-identical rankings, and a contained direct-versus-port discovery job matches all 500 tasks; dirty-source and self-attested runtime provenance keep these results below local-reproduced evidence grade.
      - The released 483/500 any-hit artifact was introduced under ChromaDB 0.6.3, while the pinned current lock resolves 1.5.7; current-lock reproduction is a distinct discovery result rather than provenance for the historical artifact.
      - The 96.6 percent headline is custom recall_any@5, while official LongMemEval excludes abstentions and reports recall_all@5; the two metrics must remain separate.
      - A hash-verified local audit of the released artifact recomputes custom recall_any@5/10 as 96.6/98.2 percent and, over 470 non-abstention tasks, official recall_all@5/10 as 85.7447/93.4043 percent and NDCG@5/10 as 87.4322/89.0094 percent; this audits historical bytes but does not reproduce the current lock.
      - The official runtime image excludes benchmarks; the existing benchmark-specific offline image/Slurm run is discovery-only and needs a clean externally attested rebuild.
      - The task-blind matched mechanism port has exact 500-task production-Chroma equivalence but no frozen all-SERVE actor bundle or semantic quality result.
      - The graph option must be isolated from the raw-log baseline rather than treated as one system.

  reme:
    kind: file-authority-and-graph-retrieval-system
    title: "ReMe"
    observed_on: "2026-08-13"
    primary_sources:
      - https://aclanthology.org/2026.findings-acl.829/
      - https://github.com/agentscope-ai/ReMe
    repositories:
