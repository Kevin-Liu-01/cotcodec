      - Full benchmark logs are linked through mutable Google Drive folders rather than sealed in the pinned repository.
      - The results change compaction, payload trimming, archive recovery, and context layout together, so a matched component ablation is required.
      - Two clean network-disabled Docker states reproduced that the actual MCP recovery path searches across all sessions under the shared state root even though a strict per-session lower-level resolver exists; session B plaintext was recoverable without a session parameter before and after restart.
      - Archive filenames use Date.now plus a sanitized segment identifier and ordinary writeFile. Two same-millisecond writes reused one path, leaving both keys but making the first key resolve the second payload.
      - The artifact-store API exposes archive, read, and resolve but no native scoped purge. Both plaintext session canaries remained in the retained state archives, so H100 actor admission is forbidden for this revision.
      - The pinned relevant upstream suite passed 47 of 49 tests; both MCP tests failed because product-surface imports undeclared @lightmem2/kernel. This is a local negative lifecycle reproduction, not memory-quality or publication evidence.

