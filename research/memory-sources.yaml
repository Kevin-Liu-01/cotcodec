    limitations:
      - The pinned repository and release source tree do not contain the local-server implementation; the reproduced v0.0.3 server is a binary-only black box rather than an open-source server reproduction.
      - Two fresh network-disabled Docker volumes reproduced loss of both acknowledged tenants after SIGKILL, including the acknowledged versioned update and its history; graceful-stop recovery pairs did persist.
      - Forget is a soft-delete operation and the release exposes no native tenant-scoped physical purge contract.
      - This is CPU lifecycle and negative evidence only, not memory-quality, benchmark, scientific-result, publication, or H100 evidence.

