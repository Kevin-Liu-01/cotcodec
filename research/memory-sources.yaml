        revision: ed80611788292ea739f1effd31f16c53823b8a0d
        license: Apache-2.0
    memory_layers: [episodic_log, procedural_memory, controller]
    mechanism: >-
      Distills generalizable reasoning items from both successful and failed
      trajectories, retrieves them for later tasks, and combines the bank with
      memory-aware test-time scaling that generates additional contrastive
      experiences.
    use_as: [procedural-memory-control, success-failure-consolidation-control, test-time-scaling-control]
    evidence_grade: paper-reported
    limitations:
      - It is a major procedural-memory and consolidation control, not an item-service causal estimator.
      - The pinned source admission audit found import-time Google clients, mutable unrevisioned embedding-model loads, and evaluation-time mutation of both query caches and procedural banks; the released drivers are not a frozen held-out control.
      - The SWE-Bench path shares append-only bank and cache files across worker threads. The WebArena scaling path reads only the final trial directory and maps reward zero to success, so it is not admissible as released.
      - Trajectory induction loads pickle input, silently drops extraction errors, samples at unseeded temperature, and appends non-atomically. A reviewed frozen-bank patch arm is required before runtime admission.
      - The additive CoTCodec frozen-bank patch contract passed twice with exact train/dev/test task-to-family manifests and pinned local BGE in network-disabled, read-only Docker; evidence `reasoningbank-frozen-bank-cpu-v1.json` is contract-only, uses synthetic procedures, and does not rehabilitate the released mutable driver.
      - The repository has a lock and benchmark surfaces but no committed sealed experiment outputs; no quality result or real trajectory induction is reproduced here and H100 work remains forbidden pending the registered matched-control gate.

