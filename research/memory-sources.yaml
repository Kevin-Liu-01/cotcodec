      receipt_sha256: 7ca80f0a5194d9e1a51ff548d4e70f12916bb70a9a047d80c4820750f301d743
    benchmark_claims:
      - benchmark: LoCoMo-10 same-generated-node retrieval
        result: "repository reports mean reward 0.780 for semantic retrieval and 0.789 for PPR=0.1; multihop is 0.722 for both"
        source_url: https://github.com/swarna-kpaul/gaama
        evidence_grade: open-harness-reported
    limitations:
      - >-
        A zero-model, matched-candidate CoTCodec component doctor passed twice
        in fresh network-disabled read-only containers: true graph 24/24, flat
        and degree/type-shuffled graph 0/24, with exact PPR-weight-zero A/A.
        This proves only the component contract and exposed that upstream hub
        dampening is canceled by row normalization; it is not a GAAMA quality
        result.
      - >-
        A superseding natural held-out retrieval doctor also passed twice in
        fresh network-disabled read-only containers. Over 1,146 questions from
        seven sealed LoCoMo conversations, dev-selected structural session and
        next-turn PPR raised evidence recall-all@10 from 0.4948 to 0.5157
        (+0.0204; conversation-level 95% CI [0.0125, 0.0296]) and beat the
        mean of three typed per-node-degree-preserving shuffled graphs by
        0.0217 (95% CI [0.0130, 0.0320]). The evidence validator reruns every
        ranking from the embedded pinned LoCoMo artifact. This is a raw
        dialogue retrieval result, not generated-node, answer-quality, agent,
        or publication evidence.
      - >-
        The registered Qwen3.5-4B H100 actor translation screen completed all
        1,000 cases across Slurm jobs 295 and 297, including a controlled USR1
        checkpoint at case 656 and byte-exact fresh-job resume. Although true
        graph evidence retained a small retrieval advantage over flat evidence
        (0.385 versus 0.375 recall-all@10), its actor token F1 was lower than
        flat (0.2741 versus 0.2831; clustered difference -0.0088, 95% CI
        [-0.0267, 0.0053]) and did not beat the mean of three topology shuffles.
        The registered actor-translation hypothesis is killed and larger-model
        escalation is forbidden; the earlier retrieval-component positive is
        retained only as a component result.
      - The repository's direct same-node graph delta is about one percentage point overall and zero on its multihop aggregate; the larger raw-RAG delta largely includes generated abstraction, not graph traversal alone.
      - The official graph-edit evaluation learns from each evaluation question, persists the edits, and then reevaluates the same question set, so it is transductive self-test adaptation rather than held-out longitudinal evidence.
      - There is no lock, container, or test suite; model, embedding, graph construction, PPR, memory packing, actor, and judge costs require immutable receipts and separate ablations.

