        license: Apache-2.0
    memory_layers: [inactive_archive, episodic_log, semantic_profile, temporal_graph, controller]
    mechanism: >-
      Converts source JSONL into daily Markdown and higher-level digests, then
      combines file authority, BM25 or vector retrieval, wikilinks, and graph
      expansion behind CLI search, read, write, and traversal operations.
    use_as: [file-authority-control, consolidation-control, hybrid-graph-control]
    evidence_grade: open-harness-reported
    limitations:
      - No result has been independently reproduced in this repository.
      - The base file and BM25 path can run without a model, while memory evolution requires separately charged model calls.
      - The pinned repository lacks a fully resolved Python lock for end-to-end benchmark reproduction.

  agentmemory:
    kind: tiered-lifecycle-memory-system
    title: "agentmemory"
    observed_on: "2026-08-13"
    primary_sources:
      - https://github.com/rohitg00/agentmemory
    repositories:
      - role: implementation-and-longmemeval-harness
        url: https://github.com/rohitg00/agentmemory
