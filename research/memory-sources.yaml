        license: MIT
    memory_layers: [episodic_log, temporal_graph, controller]
    residency_transition: separate-stores-no-transition
    graph_semantics: multi-graph
    mechanism: >-
      Keeps deterministic store, search, and decay operations in a local binary
      while the host model decides remember, update, and forget actions. Mnemon
      core provides isolated named SQLite stores with temporal, entity, causal,
      and semantic edges. The separately pinned dsh-mnemon plugin persists an
      active-store registry, restricts default recall to active stores, rejects
      explicit reads from inactive stores, and activates a targeted store after
      a write.
    use_as: [host-supervised-crud-control, active-space-control, multi-graph-retrieval-control]
    evidence_grade: local-negative-reproduced
    reproduction_receipt:
      artifact_path: research/evidence/memory/mnemon-h100-static-space-negative-v1.json
      receipt_sha256: e94b3ece8a972d35da0f60b454cf2dbce34916abfdfbcb8152761c68cf399846
    limitations:
      - Two network-disabled CPU repeats prove static store isolation, active-set recall filtering, targeted-write activation, and restart persistence.
      - "H100 job 313 and byte-exact fresh-allocation resume job 315 killed the static-routing quality hypothesis: lexical routing and all-spaces both scored 32/32 exact, so routing added zero token-F1 lift; its prompt-token ratio was 0.7815 and failed the registered matched-budget band."
      - The active-space layer belongs to dsh-mnemon rather than Mnemon core, and the registry provides no access-control boundary.
      - Active spaces are query scopes, not learned promotion, demotion, or bidirectional item paging.
      - Mnemon forget is a soft delete that retained the unique plaintext in SQLite; the reproduced physical removal operation deletes an entire non-final store, not one item.
      - No sealed external benchmark result was located at the audited revision.
      - Do not escalate this revision to a larger actor; any future routing hypothesis needs a materially different mechanism, a new preregistered panel, and matched prompt budgets.

