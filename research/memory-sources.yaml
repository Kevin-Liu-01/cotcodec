      - The retained controls omit MemoryBank summary/personality generation and destructive stochastic deletion; they test only prefix-measurable decay, explicit-access strengthening, and deterministic retrieval ranking.
      - >-
        The bounded Qwen3.5-4B H100 screen passed the registered
        corrected-minus-upstream contrast at +10.97 executable-success points
        with a task-clustered 95% interval of [+6.15, +16.24], zero safety
        failures, and valid actions in every cell. This repairs the upstream
        precedence bug on the synthetic panel; it is not an upstream MemoryBank
        or paper-result reproduction.
      - >-
        The no-decay upper control decisively beat corrected decay:
        corrected-minus-no-decay was -58.39 served executable-success points
        with a 95% interval of [-66.77, -50.00]. Larger-model admission is
        therefore killed for this mechanism at the registered settings;
        forgetting removed useful evidence rather than improving selection.
      - >-
        Paper results are not reproduced, and decay plus summary generation
        does not demonstrate active-to-inactive paging or item-level causal
        utility. The H100 result remains discovery-only because the source
        archive captured a dirty worktree and the task panel is synthetic.

