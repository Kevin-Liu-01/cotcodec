  mem0-lifecycle-adapter:
    kind: native-lifecycle-adapter-study
    title: "Mem0 native lifecycle adapter doctor"
    observed_on: "2026-08-14"
    primary_sources:
      - https://github.com/mem0ai/mem0
    repositories:
      - role: reviewed-native-backend-target
        url: https://github.com/mem0ai/mem0
        revision: 71f2ebefa3494da21550fb525216818776cde67f
        license: Apache-2.0
    memory_layers: [inactive_archive, semantic_profile, controller]
    residency_transition: none
    mechanism: >-
      Exercises the pinned local Mem0 backend through an additive task-blind
      memory-lifecycle-v1 adapter with explicit apply, query, checkpoint,
      restore, inspect, and purge operations; all records remain in an inactive
      archive and unsupported maintenance or feedback operations are refused.
    use_as: [native-crud-conformance-control, restart-verification-control, adapter-crash-recovery-negative]
    evidence_grade: local-negative-reproduced
    reproduction_receipt:
      artifact_path: research/evidence/memory/mem0-lifecycle-adapter-v6.json
      receipt_sha256: 99edcd00d042361c998d9ba9aa18d67c5963534aedcd922d7ef831f7428a2880
    limitations:
      - Two fresh non-root, network-disabled, read-only Docker repetitions produced the same stable projection and passed every registered non-crash CRUD, restart-verification, branch-isolation, lineage, idempotency, and ordinary-scope purge gate.
      - A forced crash after the native mutation but before lifecycle-journal commit leaves an ambiguous pending operation. The adapter fails closed and cannot continue, and the interrupted scope retains the plaintext canary in history.db and Qdrant storage.sqlite; v6 seals independently validated bounded byte windows for both files. H100 admission is blocked until exact recovery and residue clearance are implemented and reproduced.
      - This is a CoTCodec adapter recovery defect, not evidence of an upstream Mem0 database defect or a memory-quality result.
      - The doctor uses deterministic loopback embeddings and infer=false; it does not reproduce Mem0 extraction, graph memory, managed service behavior, actor quality, or vendor benchmark claims.
      - The local image is dirty-development discovery evidence without external Slurm, OCI-registry, SBOM, or trust-root attestation.

  langmem:
    kind: system
    title: "LangMem"
    observed_on: "2026-08-11"
    primary_sources:
      - https://github.com/langchain-ai/langmem
    repositories:
      - role: implementation
        url: https://github.com/langchain-ai/langmem
        revision: 29cbe41e58528f92e9efa773c12e15c47be3808c
        license: MIT
    memory_layers: [inactive_archive, semantic_profile, procedural_memory, controller]
    mechanism: >-
      Supports hot-path memory tools and a background manager that extracts,
      consolidates, and updates memories in a LangGraph store.
    use_as: [hot-path-vs-background-baseline, procedural-memory-baseline]
    evidence_grade: local-negative-reproduced
    reproduction_receipt:
      artifact_path: research/evidence/memory/langmem-native-lifecycle-negative-v1.json
      receipt_sha256: 76f8b3d8ae7db854b0cd2d77578aef09a82a1f450af75d86bdcaccf092bc0d8a
    limitations:
      - Framework integration and storage policy are coupled in the reference implementation.
      - Exact source identity is tree d85d1f815fb2b54bbc0a85c18453b7a7953ca38c, git-archive SHA-256 24c85c514c80bb263a16626971e8ef53978fd1bc7f9319e47d8a5a0bf4956521, and MIT license SHA-256 98af1351ea856e008c835bc89a312905960a318072f950732bf346c741027c7d.
      - Two clean ARM64 Docker repetitions passed public hot-path CRUD, deterministic background-manager persistence, user isolation, logical deletion, and PostgreSQL plus fresh-process restart with stable semantic projection 96602010adaf5b90c706c9be759d4790464ccd7a2ee4eea302011ce76cbdac61.
      - The exact official PostgresStore path exposes per-record delete but no first-class namespace purge. Enumerate-then-delete made the tested scopes logically empty, yet all four purged plaintext canaries remained recoverable from both the PostgreSQL heap and WAL after clean shutdown.
      - Deterministic extraction isolated lifecycle transport from model quality, and vector indexing was disabled. Extraction quality, semantic retrieval, procedural prompt quality, managed LangGraph service behavior, active/inactive paging, and actor quality were not evaluated.
      - This exact revision is killed before H100 admission. A newer pin or explicit repair arm must supply first-class scoped purge plus physical purge or cryptographic erasure and pass the same two-clean-state lifecycle doctor.

