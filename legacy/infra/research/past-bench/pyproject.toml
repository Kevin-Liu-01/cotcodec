[project]
name = "cotcodec-past-bench-runtime"
version = "0.0.0"
description = "Dependency-only lock project for the pinned PAST-Bench Hermes+ pilot"
requires-python = "==3.11.*"
dependencies = [
    "anthropic>=0.39.0,<1",
    "edge-tts>=7.2.7,<8",
    "fal-client>=0.13.1,<1",
    "fastapi>=0.115",
    "faster-whisper>=1.0.0,<2",
    "fire>=0.7.1,<1",
    "firecrawl-py>=4.16.0,<5",
    "httpx>=0.28.1,<1",
    "jinja2>=3.1.5,<4",
    "openai>=2.21.0,<3",
    "openpyxl>=3.1",
    "parallel-web>=0.4.2,<1",
    "pip>=26.0,<27",
    "prompt-toolkit>=3.0.52,<4",
    "pydantic>=2.12.5,<3",
    "pypdf>=4.0",
    "pyjwt[crypto]>=2.12.0,<3",
    "python-docx>=1.2",
    "python-dotenv>=1.2.1,<2",
    "python-pptx>=1.0",
    "pyyaml>=6.0.2,<7",
    "requests>=2.33.0,<3",
    "rich>=14.3.3,<15",
    "setuptools>=82,<83",
    "tenacity>=9.1.4,<10",
    "trafilatura>=1.8",
    "uvicorn>=0.30",
    "wheel>=0.46,<1",
]

[dependency-groups]
test = [
    "pytest>=9.0.2,<10",
    "pytest-asyncio>=1.3.0,<2",
    "pytest-xdist>=3.0,<4",
]

[tool.uv]
package = false
exclude-newer = "2026-08-14T00:00:00Z"
required-version = "==0.11.30"
