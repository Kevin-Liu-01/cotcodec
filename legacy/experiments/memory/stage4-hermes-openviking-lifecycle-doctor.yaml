contract:
  provider_path: exact-hermes-openviking-provider
  tenant_count: 2
  restart_count: 2
  operation_sequence:
    - tenant-a-write
    - tenant-a-restart-search
    - tenant-b-cannot-see-a
    - tenant-b-write
    - tenant-a-cannot-see-b
    - tenant-a-restart-read
    - tenant-a-forget
    - tenant-b-forget
    - tenant-a-delete-survives-restart
    - tenant-b-delete-survives-restart
  require_prompt_integration_active: true
  require_restart_persistence: true
  require_tenant_isolation: true
  require_logical_delete_survives_restart: true
  scan_all_retained_files_for_plaintext: true
  model_calls: 0
  external_network_calls: 0

