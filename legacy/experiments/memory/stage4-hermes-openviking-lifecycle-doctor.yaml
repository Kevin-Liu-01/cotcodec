schema_version: 1
name: stage4-hermes-openviking-lifecycle-doctor
description: >-
  Native OpenViking lifecycle and exact Hermes-provider falsifier. Exercise
  direct write, search, read, logical forget, two fresh backend restarts, and
  two-tenant isolation with deterministic local model stubs, then scan the
  retained state for plaintext residue. This is not a memory-quality study.

