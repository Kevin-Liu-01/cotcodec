contract:
  provider_path: exact-hermes-hindsight-provider
  hermes_client_version: "0.6.1"
  native_service_version: "0.9.0"
  tenant_count: 2
  full_stack_restart_count: 2
  operation_sequence:
    - tenant-a-tool-retain
    - tenant-a-prefetch
    - tenant-b-cannot-see-a
    - tenant-b-sync-turn-retain
    - tenant-b-search-own
    - tenant-a-cannot-see-b
    - tenant-a-full-restart-search
    - tenant-b-full-restart-search
    - tenant-a-admin-delete
    - tenant-b-admin-delete
    - tenant-a-delete-survives-full-restart
    - tenant-b-delete-survives-full-restart
  require_prompt_integration_active: true
  require_auto_prefetch: true
  require_session_end_auto_retain: true
  require_restart_persistence: true
  require_tenant_isolation: true
  require_logical_delete_survives_restart: true
  require_hermes_purge_tool: false
  scan_all_retained_files_for_plaintext: true
  model_calls: 0
  external_network_calls: 0

expected_falsification:
  status: BLOCKED_NATIVE_PHYSICAL_PURGE_RESIDUE
  restart_persistence_supported: true
  tenant_isolation_supported: true
  logical_delete_survives_restart: true
  hermes_purge_tool_exposed: false
  physical_zero_plaintext_residue: false

admission:
  provider_contract: local-negative-only
  memory_quality_h100: forbidden-for-this-revision
  unblock_requires:
    - first-class-hermes-purge-tool-or-registered-administrative-erasure-contract
    - native-physical-purge-or-crypto-erasure
    - zero-plaintext-residue-after-fresh-database-and-backend-restart
    - separate-matched-quality-cell-after-lifecycle-pass

claims:
  scientific_result: false
  publication_ready: false
  supports: >-
    exact Hermes retain, recall, prefetch, and session-end retention transport;
    native restart persistence; logical tenant isolation; logical deletion
  does_not_support: >-
    a Hermes purge tool, physical erasure, memory quality, agent improvement,
    H100 admission, or publication claims

limitations:
  - >-
    Hermes' plugin manifest accepts hindsight-client >=0.6.1, while its lazy
    dependency allowlist pins exactly 0.6.1. This doctor follows the executable
    exact pin and tests it against Hindsight service 0.9.0.
  - >-
    Hindsight's embedded pg0 path was not used in the registered run because
    pg0 0.15.1 started a queryable PostgreSQL process but returned running=false
    and no URI to Hindsight on this contained arm64 runtime. The registered
    study uses Hindsight's supported external PostgreSQL configuration instead.
