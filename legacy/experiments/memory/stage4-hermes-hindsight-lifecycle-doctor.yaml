schema_version: 1
name: stage4-hermes-hindsight-lifecycle-doctor
description: >-
  Native Hindsight lifecycle and exact Hermes-provider falsifier. Exercise
  direct retain, auto-prefetch, session-end auto-retain, two fresh backend and
  database restarts, two-tenant isolation, and native admin deletion with a
  deterministic local embedding service, then scan all retained PostgreSQL
  files for plaintext residue. This is not a memory-quality study.

