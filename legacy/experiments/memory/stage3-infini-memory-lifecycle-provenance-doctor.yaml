schema_version: 1
name: stage3-infini-memory-lifecycle-provenance-doctor
status: registered-cpu-falsification
scientific_result: false
publication_ready: false
description: >-
  Exercise Infini Memory's exact public file-backed lifecycle in two clean,
  network-disabled ARM64 containers with a deterministic local LLM double.
  Normal CRUD, BM25 retrieval, restart, document deletion, and user deletion
  are positive controls. Relative, absolute, and alias-equivalent user IDs
  probe storage-root confinement; contained escaped-user deletion probes the
  recursive-delete boundary. Forced failures between Markdown and index writes
  plus a truncated-index restart probe generation recovery. Rewrite, LLM, BM25,
  and direct-Markdown work is counted only as a non-scientific diagnostic.

