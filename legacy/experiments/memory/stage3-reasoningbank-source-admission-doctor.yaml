name: stage3-reasoningbank-source-admission-doctor
status: registered-source-admission-doctor
scientific_result: false
protocol: procedural-bank-source-admission-v1
description: >-
  Audit the exact ReasoningBank release without importing its cloud-coupled
  modules. Bind the source, lock, and critical driver files; identify
  evaluation-time mutation and concurrency hazards; and prohibit an H100
  actor study until a frozen held-out procedural bank and immutable retrieval
  cache exist. This is source admission evidence, not memory-quality evidence.

