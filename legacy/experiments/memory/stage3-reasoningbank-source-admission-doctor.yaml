mechanism_scope:
  representation: success-and-failure-procedural-items
  residency: immutable-inactive-bank-after-training
  retrieval: top-one-query-similarity
  injection: system-prompt-procedural-text
  lifecycle_provider_claim: forbidden
  active_inactive_paging_claim: forbidden
  causal_credit_claim: forbidden

release_findings:
  import_time_cloud_clients: true
  mutable_unrevisioned_embedding_models: true
  webarena_query_cache_mutates_during_evaluation: true
  webarena_bank_mutates_after_each_evaluation_task: true
  swebench_query_cache_mutates_during_evaluation: true
  swebench_bank_mutates_after_each_evaluation_task: true
  swebench_shared_bank_and_cache_used_by_worker_threads: true
  trajectory_pickle_is_trusted_input: true
  trajectory_extraction_swallows_exceptions: true
  induction_temperature_is_unseeded: true
  scaling_reads_only_final_trial_directory: true
  scaling_reward_label_is_inverted: true

required_patch_arm:
  freeze_bank_before_dev_and_test: true
  freeze_retrieval_index_before_dev_and_test: true
  disjoint_workflow_families: [train, dev, test]
  offline_pinned_embedder: true
  no_import_time_provider_client: true
  no_pickle_input: true
  deterministic_generation_receipts: true
  atomic_idempotent_artifacts: true
  matched_controls:
    - no-memory
    - raw-success-trajectory
    - raw-failure-trajectory
    - success-only-procedural-items
    - failure-only-procedural-items
    - shuffled-procedural-items
    - reasoningbank-success-and-failure

execution:
  source_checkout_only: true
  runtime_import_forbidden: true
  network: none
  api_calls: 0
  gpus: 0
  max_gpu_hours: 0
  cpu_time_limit_minutes: 2
  sudo: forbidden

admission:
  status: BLOCKED_MUTABLE_EVALUATION_AND_UNPINNED_RETRIEVAL
  h100_admission: forbidden-for-this-release-driver
  next_gate: reviewed-frozen-bank-patch-arm-and-contained-cpu-retrieval-doctor
  publication_ready: false

forbidden_claims:
  - ReasoningBank quality was reproduced
  - released WebArena evaluation is held out
  - released SWE-Bench evaluation is order independent
  - released test-time scaling preserves reward labels
  - ReasoningBank is a persistent lifecycle provider
  - H100 admission passed
