description: >-
  Test the immutable Supermemory local v0.0.3 Linux ARM64 release as a black-box
  artifact. The official repository and release commit do not contain the local
  server implementation, so this is not an open-source code reproduction. The
  cell admits only direct-memory CRUD, crash/restart, tenant isolation, and
  physical-purge capability claims.

