    - verify-cross-container-isolation
    - native-soft-forget-container-a
    - verify-container-b-survives
    - scan-provider-state-for-plaintext-canaries

expected_outcome:
  status: BLOCKED_ACKNOWLEDGED_WRITES_LOST_ON_SIGKILL
  acknowledged_writes_survive_sigkill: false
  version_history_survives_sigkill: false
  graceful_restart_persists_acknowledged_pair: true
  cross_tenant_plaintext_disclosure: false
  soft_forget_excludes_normal_search: true
  provider_plaintext_at_rest_detected: false
  native_tenant_scoped_physical_purge_available: false
  reproduced_in_two_clean_states: true

admission:
  memory_lifecycle_h100: forbidden-for-this-release
  quality_claim: forbidden
  publication_reproduction: forbidden
  unblock_requires:
    - auditable local-server source at an immutable revision or explicit binary-only claim
    - acknowledged direct-memory writes survive abrupt process loss
    - native or adapter-scoped physical purge with zero retained tenant state
    - contained Linux AMD64 Slurm confirmation
    - matched actor and judge contract after lifecycle admission

forbidden_claims:
  - open-source local-server reproduction
  - compliant physical deletion
  - memory quality improvement
  - model-independent provider comparison
  - H100 ready
  - publication ready
