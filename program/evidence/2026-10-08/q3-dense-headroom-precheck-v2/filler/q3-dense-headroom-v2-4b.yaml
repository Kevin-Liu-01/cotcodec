# q3-dense-headroom-precheck-v2, Qwen3.5-4B-Base lane (program decisions D36, D42, D44).
# v1's lane (same inputs, model, argv shape, CPUs, memory and profile) on v2's entry point,
# 1 GPU x 32 minutes under a cap of 32/60 GPU-h (0.5333), from a measurement of the fixed path:
# the second development timing job (Slurm 810, D42 (ii); cuDNN's attention off) ran this lane's
# start-up and its units of every stage on the GPU (registration decisions 20 and 21). Three
# estimates of the full-lane evaluation and statistics were computed from it: per-stage means
# scaled to the lane's context lengths, 769 s; a per-stage line in tokens, 789 s; the larger of
# the two in every stage, 824 s (each with an allowance for one-off compiles and a 5 s
# statistics bound). Twice each, plus 79 s of measured start-up, plus the 3-minute SIGUSR1 lead,
# gives 30, 31 and 32 minutes; the limit is the largest (D44). The one continuation is kept
# inside the lane's minutes. v2's caps and both timing jobs sum to 0.933 GPU-h, within D36's
# 1.5. The cap is written to 16 digits so that it equals 32/60 and the submitter's
# GPUs x minutes / 60 does not exceed it. The bundle's Qwen3 tokens are decoded with the
# bundle's receipted tokenizer and re-encoded with the 4B tokenizer. container_profile
# large-cpu-mem gives an exec /tmp: the gated-delta layers run flash-linear-attention's
# Triton kernels from the pinned image (library code, compiled by Triton at first use; the
# entry point points Triton's cache at /outputs).
