    statement: The dock on the left side of the GIMP window (toolbox/tool-options dock) is removed/hidden.
    check_kind: config_value
    observable: GIMP's saved session (~/.config/GIMP/2.10/sessionrc) no longer contains the left dock column (no "left-docks" entry with dockables in the single-window layout), or docks are hidden (hide-docks yes) - state persisted after GIMP exits.
allowed_variations:
