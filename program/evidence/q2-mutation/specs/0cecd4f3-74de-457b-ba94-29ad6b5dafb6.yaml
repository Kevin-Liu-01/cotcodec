task_id: 0cecd4f3-74de-457b-ba94-29ad6b5dafb6
author: blind-model-author-v1
requirements:
  - req_id: R0
    statement: (implicit) The workbook is persisted at /home/user/copy_sheet_insert.xlsx.
    check_kind: file_exists
    observable: File exists and loads.
  - req_id: R1
    statement: The first sheet (initially "Sheet1"; the instruction calls it "Sheet 1") is renamed "LARS Resources".
    check_kind: other
    observable: Sheet at index 0 is named exactly "LARS Resources" and its cell contents equal the initial Sheet1.
  - req_id: R2
    statement: A copy of that sheet exists, named "LARS Resources (Backup)" (suffix "(Backup)" joined by one space), placed immediately before the sheet that was originally "Sheet2".
    check_kind: other
    observable: Sheet at index 1 is named exactly "LARS Resources (Backup)"; its cell values equal those of "LARS Resources" (A1:G23).
  - req_id: R3
    statement: The original "Sheet2" is renamed "LARS Resources (Offline)" and keeps its content.
    check_kind: other
    observable: Sheet at index 2 is named exactly "LARS Resources (Offline)"; its values equal initial Sheet2 values (A1:G23).
  - req_id: R4
    statement: (implicit) No sheet is deleted; Sheet3 remains after the renamed sheets.
    check_kind: other
    observable: Final sheet order is ["LARS Resources", "LARS Resources (Backup)", "LARS Resources (Offline)", "Sheet3"].
allowed_variations:
  - Whether the copy keeps every formatting attribute of the source (column widths, hyperlinks) is not constrained beyond cell values; a native "Move/Copy sheet" copy is the expected route.
  - Active sheet and view settings are not constrained.
  - Hidden-row state of the renamed former Sheet2 is expected to be preserved but is not mentioned by the instruction.
