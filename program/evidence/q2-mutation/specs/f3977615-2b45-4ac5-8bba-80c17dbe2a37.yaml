requirements:
  - req_id: R1
    statement: VLC allows multiple instances so a newly launched video plays in its own window.
    check_kind: config_value
    observable: ~/.config/vlc/vlcrc has one-instance=0 and one-instance-when-started-from-file=0 (the "Allow only one instance" options disabled).
allowed_variations:
  - '[AMBIGUOUS] Enqueue-related options (playlist-enqueue) are not required.'
