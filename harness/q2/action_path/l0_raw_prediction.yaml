# Predicted outcome of the L0-raw control (validity control C2), written from
# code reading before any L0-raw trial exists. C2 passes only if the observed
# failing set equals predicted_fail exactly; a miss in either direction is
# reported and explained, and this file is never edited afterwards.
#
# L0-raw: each IR action becomes the natural PyAutoGUI 0.9.54 call (one
# DesktopEnv.step per IR action) and is sent unchanged through OSWorld
# b138d348's DesktopEnv.step -> PythonController.execute_python_command,
# i.e. `python -c <PYAUTOGUI_PKGS_PREFIX + command>` posted to the guest's
# /execute with shell=False. Strings are embedded with json.dumps(ensure_ascii=False),
# the convention of OSWorld's bfd62bdc Qwen3.5 agent.
schema: cotcodec-q2-l0-raw-prediction-v1
status: draft
basis:
  osworld: >-
    b138d348256078fa634fc3b73567a7337c793e6b desktop_env/controllers/python.py:
    PYAUTOGUI_PKGS_PREFIX sets FAILSAFE=False and patches isShiftCharacter with a
    Linux shift set that excludes '<'; execute_python_command posts
    ["python", "-c", ...] with "shell": false.
  pyautogui: >-
    PyAutoGUI 0.9.54 sdist (sha256 dd1d29e8fd118941cb193f74df57e5c6ff8e9253b99c7b04f39cfc69f3ae04b2),
    pyautogui/_pyautogui_x11.py: keyboardMapping has no entry for non-ASCII characters or
    for 'kp_enter'; _keyDown returns silently for unmapped keys; BUTTON_NAME_MAPPING
    covers buttons 1-7 only; _vscroll uses 4 (up) / 5 (down) and _hscroll 6 (left) / 7 (right).
  python_xlib: >-
    0.33 in the guest; Display.keysym_to_keycode returns the keycode with the lowest
    (index, keycode) pair.
  guest_facts: >-
    Boot report (VM campaign job 374, cycle 0): Ubuntu 22.04.3, Xorg, GNOME Shell 42.9,
    xkb rules evdev, model pc105, layout us,us; xmodmap keycode 94 = less greater, keycode
    59 = comma less, keycode 60 = period greater; pyautogui 0.9.54; /usr/bin/python serves
    /execute.
translation:
  move: pyautogui.moveTo(x, y)
  click: optional keyDown(mod) for each modifier; pyautogui.click(x, y, clicks=n, button=b) (tripleClick for n=3); keyUp in reverse; one step
  button_down: pyautogui.mouseDown(x, y, button=b)
  button_up: pyautogui.mouseUp(x, y, button=b)
  drag: keyDown(mods); moveTo(p0); mouseDown(button=b); moveTo(p_i, duration=d/(k-1)) for each later point; mouseUp(button=b); keyUp(mods); one step
  scroll: keyDown(mods); pyautogui.scroll(-wheel_y, x, y) and/or pyautogui.hscroll(wheel_x, x, y); keyUp(mods); one step
  key: pyautogui.press(name) for one key, pyautogui.hotkey(*names) for a chord
  key_down: pyautogui.keyDown(name) per key
  key_up: pyautogui.keyUp(name) per key, in the listed order
  type: pyautogui.typewrite(text)
  wait: time.sleep(ms / 1000)
key_names:
  # IR keysym -> the PyAutoGUI name sent. Where PyAutoGUI has no name, the
  # lowercase keysym name is sent unchanged, as an upstream harness would.
  Return: enter
  Escape: esc
  Tab: tab
  BackSpace: backspace
  Delete: delete
  Insert: insert
  Home: home
  End: end
  Prior: pageup
  Next: pagedown
  Up: up
  Down: down
  Left: left
  Right: right
  space: space
  Control_L: ctrl
  Shift_L: shift
  Alt_L: alt
  Super_L: winleft
  Menu: apps
  KP_Add: add
  KP_Enter: kp_enter
  Caps_Lock: capslock
  F1: f1
  F4: f4
  F5: f5
  F9: f9
  F12: f12
predicted_fail:
  - type_unicode_bmp
  - type_emoji
  - type_rtl
  - type_combining
  - type_emoji_zwj
  - key_kp_enter
  - click_button_back
  - click_button_forward
predicted_unsupported: []
predicted_pass_notable:
  - type_shell_hostile
  - type_symbols_shifted
  - key_menu
  - key_kp_add
  - caps_lock_roundtrip
  - chord_super_d
reasons:
  type_unicode_bmp: every non-ASCII code point is absent from keyboardMapping and is skipped silently
  type_emoji: astral code points are absent from keyboardMapping and are skipped silently
  type_rtl: Hebrew and Arabic code points are skipped; only the spaces are typed
  type_combining: the combining marks U+0301, U+0308 and U+0303 are skipped
  type_emoji_zwj: emoji and U+200D are skipped
  key_kp_enter: "PyAutoGUI has no KP_Enter name; 'kp_enter' is unmapped and dropped without an event"
  click_button_back: button 8 is outside BUTTON_NAME_MAPPING; the call raises and nothing is sent
  click_button_forward: button 9 is outside BUTTON_NAME_MAPPING; the call raises and nothing is sent
  type_shell_hostile: /execute runs an argv with shell=False, so no shell expansion can occur
  type_symbols_shifted: "with the b138d348 Linux shift set, '<' is typed unshifted on keycode 94 (less), '>' shifted on keycode 60"
  key_menu: "'apps' maps to the Menu keysym (keycode 135)"
  key_kp_add: "'add' maps to KP_Add (keycode 86)"
  caps_lock_roundtrip: "'capslock' maps to Caps_Lock (keycode 66); two presses toggle the lock on and off"
  chord_super_d: "'winleft' maps to Super_L (keycode 133)"
