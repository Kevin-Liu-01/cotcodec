schema: cotcodec-q2-action-path-catalog-v1
status: draft
screen: [1920, 1080]
description: Independent reimplementation of a 100-entry action-path catalog. Entry IDs and group sizes
  are public facts from sandweave@99ba1abe report.json; every action, coordinate, string and expectation
  here was written for this repository.
probe_buffer_rules: {printable: the code points produced for a KeyPress are appended, Return: \n, KP_Enter: \n,
  Tab: \t, BackSpace: deletes the last code point, other: keys that produce no text leave the buffer unchanged}
event_rules: {events: ordered key and button events; motion is ignored unless a field asks for it, key_event: '[KeyPress|KeyRelease,
    keysym name]', button_event: '[ButtonPress|ButtonRelease, X button, x, y] with tolerance_px', events_scope_pointer: only
    button events are compared; text is compared separately, button_state_includes: every button event's
    state mask must include these modifiers, min_gap_ms: '[i, j, ms]: server time of event j minus event
    i is at least ms', max_gap_ms: '[i, j, ms]: server time of event j minus event i is at most ms', min_motion_events: 'at
    least this many MotionNotify events in the entry; with button events, between the first and the last
    of them', order_multiset: events compared as a multiset, rdev: key events must equal the frozen R-dev
    reference stream for rdev_input}
