# Suite mutation operators for q2-action-path-v1 (reviewed plan, defect B2).
#
# The suite is itself a checker, so it is mutation-tested: each operator is a
# deliberate defect applied to the L0-fixed executor or to a harness parser.
# Validity control C3 requires that 100% of non-equivalent mutants are killed
# (some catalog entry or regression case fails, or the entry guard fires).
# `detected_by` is the author's prediction of which entries kill a mutant; it
# is reported next to the observed killers and is never used to score.
#
# Layers: executor = applied to the IR -> device translation of L0-fixed;
# parser = applied to a harness's response parser (IR emit boundary);
# both = applied to each.
schema: cotcodec-q2-mutation-operators-v1
status: draft
equivalence_rule: >-
  A mutant is equivalent only if, on every catalog entry (and every regression
  case, for parser mutants) in the same run order, its XRecord event stream
  with timestamps removed, its probe text buffer and its terminal action are
  byte-identical to those of the unmutated code. Equivalence is decided by
  this comparison alone, never by argument.
operators:
  - id: M01-modifier-released-early
    layer: both
    description: Modifier keys are pressed and released before the pointer action instead of being held across it (the Table 20 Ctrl-click defect).
    detected_by: [click_ctrl_left, click_shift_left, click_alt_left, click_ctrl_shift_right, scroll_ctrl_down_3, scroll_shift_down_3, "regression:ctrl_click_keys", "regression:ctrl_click_text"]
  - id: M02-button-swap-left-right
    layer: executor
    description: X buttons 1 and 3 are swapped.
    detected_by: [click_left_center, click_right, drag_short]
  - id: M03-middle-click-noop
    layer: both
    description: A middle click produces no input (the Table 20 middle-click defect).
    detected_by: [click_middle, "regression:middle_click"]
  - id: M04-coordinate-shift-5px
    layer: executor
    description: Every pointer x coordinate is shifted by +5 px.
    detected_by: [click_left_center, move_only, drag_short]
  - id: M05-scroll-sign-flip
    layer: both
    description: The vertical wheel direction is inverted.
    detected_by: [scroll_down_1, scroll_up_3, scroll_down_then_up_net_zero, "regression:scroll_at_coordinate"]
  - id: M06-scroll-ticks-doubled
    layer: executor
    description: Each wheel click is sent twice.
    detected_by: [scroll_down_1, scroll_down_3]
  - id: M07-text-drop-last-char
    layer: executor
    description: The last code point of every typed string is not typed.
    detected_by: [type_single_char, type_plain]
  - id: M08-text-nfc-normalize
    layer: executor
    description: Typed text is NFC-normalized before typing.
    detected_by: [type_combining]
  - id: M09-text-drop-non-ascii
    layer: executor
    description: Code points above U+007F are silently skipped.
    detected_by: [type_unicode_bmp, type_emoji, type_rtl, type_combining, type_emoji_zwj, "regression:non_ascii_type"]
  - id: M10-less-to-greater
    layer: executor
    description: The `<` character is typed with Shift held on the 102nd key, producing `>`.
    detected_by: [type_symbols_shifted, type_shell_hostile, type_long_500]
  - id: M11-unknown-key-dropped
    layer: both
    description: Key names outside a short main-block list (KP_Enter, KP_Add, Menu, Caps_Lock, Super_L) are silently dropped.
    detected_by: [key_kp_enter, key_kp_add, key_menu, caps_lock_roundtrip, chord_super_d, "regression:named_keys"]
  - id: M12-triple-to-double
    layer: both
    description: A triple click is sent as a double click.
    detected_by: [click_triple_left, "regression:triple_click"]
  - id: M13-hscroll-to-vscroll
    layer: both
    description: Horizontal wheel input is sent on the vertical axis.
    detected_by: [scroll_left_3, scroll_right_3, scroll_diagonal, "regression:hscroll"]
  - id: M14-chord-release-order
    layer: executor
    description: Chord keys are released in press order instead of reverse order.
    detected_by: [chord_ctrl_c, chord_ctrl_shift_t, chord_ctrl_alt_shift_r]
  - id: M15-duplicate-click
    layer: executor
    description: Every single click is sent twice.
    detected_by: [click_left_center, click_burst_5]
  - id: M16-double-click-interval-600ms
    layer: executor
    description: The interval between the clicks of a double or triple click is stretched to 600 ms.
    detected_by: [click_double_left, click_triple_left]
  - id: M17-drag-teleport
    layer: executor
    description: A drag presses at the start, jumps to the end with no intermediate motion and releases.
    detected_by: [drag_short, drag_long_diagonal, drag_vertical]
  - id: M18-first-tool-call-only
    layer: parser
    description: Only the first tool call of a multi-call response is executed (the Table 20 sequence defect).
    detected_by: ["regression:move_then_scroll", "regression:move_then_drag", "regression:three_calls_one_turn"]
  - id: M19-last-tool-call-only
    layer: parser
    description: Only the last tool call of a multi-call response is executed.
    detected_by: ["regression:move_then_scroll", "regression:three_calls_one_turn"]
  - id: M20-terminate-failure-to-done
    layer: parser
    description: terminate(status=failure) is reported as success.
    detected_by: ["regression:terminate_failure"]
  - id: M21-hold-not-released
    layer: executor
    description: The release of a held modifier is skipped (a stuck modifier).
    detected_by: ["guard:click_ctrl_left", "guard:scroll_ctrl_down_3", "guard:mixed_gesture_state"]
  - id: M22-keypad-to-main
    layer: both
    description: KP_Enter is sent as Return and KP_Add as plus.
    detected_by: [key_kp_enter, key_kp_add]
  - id: M23-caps-lock-dropped
    layer: executor
    description: Caps_Lock presses are not sent.
    detected_by: [caps_lock_roundtrip]
  - id: M24-grid-1000-instead-of-999
    layer: parser
    description: Model coordinates are scaled by width/1000 instead of width/999.
    detected_by: ["regression:corner_999"]
  - id: M25-shell-expansion
    layer: executor
    description: Typed text passes through a POSIX shell before typing.
    detected_by: [type_shell_hostile]
  - id: M26-newline-dropped
    layer: executor
    description: Newline characters in typed text are skipped.
    detected_by: [type_multiline_tabs, seq_long_mixed]
  - id: M27-extra-buttons-dropped
    layer: executor
    description: Buttons 8 and 9 produce no input.
    detected_by: [click_button_back, click_button_forward]
  - id: M28-modifier-text-ignored
    layer: parser
    description: Modifiers given in the `text` parameter of a click are ignored.
    detected_by: ["regression:ctrl_click_text", "regression:shift_alt_ctrl_shift_clicks"]
